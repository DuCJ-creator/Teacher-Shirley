    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans TC', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f7f9fc 0%, #eef2f5 100%);
            color: #1a2c3e;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 頁首 */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.6rem;
            background: linear-gradient(135deg, #2b5e7a, #1e3b4a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #4a627a;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* 搜尋區 */
        .search-section {
            max-width: 600px;
            margin: 0 auto 1.5rem auto;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #7f8c8d;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px 14px 48px;
            font-size: 1rem;
            border: none;
            border-radius: 60px;
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            font-family: inherit;
            border: 1px solid #dce5ec;
        }

        #searchInput:focus {
            outline: none;
            border-color: #6c9ebf;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        }

        /* 首字母檢索欄 */
        .alpha-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
        }

        .alpha-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: white;
            color: #2c5a74;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            font-family: monospace;
        }

        .alpha-btn:hover {
            background: #e1f0f7;
            transform: scale(1.05);
        }

        .alpha-btn.active {
            background: #2b5e7a;
            color: white;
            box-shadow: 0 4px 12px rgba(43, 94, 122, 0.3);
        }

        /* 卡片網格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.8rem;
        }

        /* 閃卡容器 - 支援 3D 翻轉 */
        .flashcard-container {
            background: transparent;
            perspective: 1500px;
            height: auto;
            min-height: 380px;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 380px;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 28px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            min-height: 380px;
            backface-visibility: hidden;
            border-radius: 28px;
            background: white;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            border: 1px solid #e9f0f5;
        }

        .card-front {
            transform: rotateY(0deg);
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fefef7;
            overflow-y: auto;
        }

        /* 翻轉指示 */
        .flip-hint {
            font-size: 0.7rem;
            color: #9bb7cc;
            margin-top: 0.8rem;
            text-align: center;
            border-top: 1px dashed #e2edf2;
            padding-top: 0.8rem;
        }

        .blend-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1f5e7a;
            margin-bottom: 0.75rem;
            border-left: 5px solid #4b9bc1;
            padding-left: 16px;
        }

        .sample-area {
            flex: 1;
        }

        .sample-label {
            font-weight: 600;
            color: #1f5e7a;
            margin: 0.8rem 0 0.5rem 0;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .word-chip {
            display: inline-block;
            background: #f0f6fa;
            padding: 6px 12px;
            border-radius: 30px;
            margin: 0.3rem 0.3rem;
            font-size: 0.9rem;
            color: #1e4660;
        }

        .word-item-list {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0;
            border-bottom: 1px solid #ecf3f8;
        }

        .word-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .word-en {
            font-weight: 600;
            color: #1e4660;
            font-size: 1rem;
        }

        .word-zh {
            color: #5e7e9c;
            font-size: 0.9rem;
        }

        .speaker-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 30px;
            transition: all 0.1s;
            color: #4b9bc1;
        }

        .speaker-btn:hover {
            background: #e1f0f7;
            transform: scale(1.05);
        }

        .word-count-badge {
            font-size: 0.7rem;
            background: #eef2f7;
            padding: 4px 10px;
            border-radius: 40px;
            color: #3b6f8c;
            display: inline-block;
            margin-top: 0.5rem;
        }

        /* 模態框 (list view) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem;
        }

        .modal-content {
            background: white;
            border-radius: 2rem;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 1.8rem;
            border-bottom: 2px solid #eaf0f5;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1f5e7a;
        }

        .close-modal {
            font-size: 1.8rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #7f8c8d;
        }

        .word-list-modal {
            padding: 1rem 1.8rem 2rem;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 2rem;
            color: #6b8dab;
        }

        @media (max-width: 680px) {
            body { padding: 1rem; }
            .alpha-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .blend-title { font-size: 1.8rem; }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #7f9ab5;
        }

        .view-list-btn {
            background: #eef2f7;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            margin-top: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            color: #2b5e7a;
        }

        { blend: "spr-", allWords: ["sprig","小枝","spring","春天","sprint","衝刺"] },
        { blend: "squ-", allWords: ["squib","爆竹","squid","魷魚","squint","瞇眼","squish","壓扁"] },
        { blend: "st-", allWords: ["stab","刺傷","stack","堆疊","stag","雄鹿","staff","員工","stash","藏匿","stat","數據","stem","莖","step","步驟","stick","棍子","stiff","僵硬","still","仍然","stitch","縫合","stock","庫存","stop","停止","stub","殘端","stuck","卡住","stun","昏迷","stuff","東西"] },
        { blend: "-st", allWords: ["cast","投擲","fast","快速","last","最後","mast","桅杆","past","過去","vast","廣闊","best","最好","chest","胸膛","fest","節日","jest","玩笑","lest","以免","nest","巢","pest","害蟲","quest","探索","test","測試","vest","背心","west","西方","zest","熱情","fist","拳頭","list","清單"] },
        { blend: "str-", allWords: ["strand","海灘","strap","皮帶","stretch","伸展","strict","嚴格","strip","脫衣","struck","擊打","strum","彈奏"] },
        { blend: "sw-", allWords: ["swam","游泳","swell","腫脹","swig","大口喝","swill","泔水","swim","游泳","switch","開關","swum","游泳"] },
        { blend: "th-", allWords: ["than","比","then","那時","thin","瘦","this","這個","thud","砰聲","theft","偷竊","throb","悸動"] },
        { blend: "-th", allWords: ["bath","洗澡","math","數學","moth","飛蛾","path","路徑","with","和","cloth","布料"] },
        { blend: "thr-", allWords: ["thrash","痛打","thrift","節儉","thrill","興奮","throb","跳動","thrust","猛推"] },
        { blend: "tr-", allWords: ["track","軌道","tram","電車","trash","垃圾","trap","陷阱","trek","跋涉","trick","詭計","trill","顫音","trim","修剪","trip","旅行","trod","踩","trot","小跑","truck","卡車","trudge","跋涉"] },
        { blend: "tw-", allWords: ["twig","細枝","twin","雙胞胎","twix","兩者之間"] },
        { blend: "wh-", allWords: ["whip","鞭子","whisk","攪拌","whelp","幼犬","when","何時","whit","一點","whiz","專家"] },
        { blend: "-xt", allWords: ["next","下一個","text","文字"] }
    ];

    // 輔助: 將 allWords 轉成 [{word, meaning}]
    function getWordPairs(item) {
        const arr = item.allWords;
        const pairs = [];
        for (let i = 0; i < arr.length; i += 2) {
            if (i+1 < arr.length) pairs.push({ word: arr[i], meaning: arr[i+1] });
        }
        return pairs;
    }

    // 發音功能
    function speakWord(word) {
        if (!window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

    // 首字母檢索邏輯
    let currentFilter = "";
    function setAlphaFilter(letter) {
        currentFilter = letter;
        document.querySelectorAll('.alpha-btn').forEach(btn => {
            if (btn.dataset.letter === letter) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderCards(document.getElementById('searchInput').value);
    }

    function renderCards(searchText = "") {
        const grid = document.getElementById("cardsGrid");
        const lowerSearch = searchText.toLowerCase();
        let filtered = blendsData.filter(item => {
            const blendMatch = item.blend.toLowerCase().includes(lowerSearch);
            const wordMatch = getWordPairs(item).some(p => p.word.toLowerCase().includes(lowerSearch));
            if (!blendMatch && !wordMatch) return false;
            if (currentFilter && currentFilter !== "ALL") {
                const firstChar = item.blend.replace(/[^a-z]/gi, '')[0]?.toUpperCase();
                return firstChar === currentFilter;
            }
            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="no-results">✨ 沒有找到相符的子音組合，試試其他關鍵字～ ✨</div>`;
            return;
        }

        grid.innerHTML = filtered.map(item => {
            const pairs = getWordPairs(item);
            const frontSample = pairs.slice(0, 6);
            const backWords = pairs.slice(6);
            const hasBack = backWords.length > 0;
            const totalCount = pairs.length;

            return `
                <div class="flashcard-container">
                    <div class="flashcard" data-blend="${item.blend}">
                        <div class="card-front">
                            <div class="blend-title">${item.blend}</div>
                            <div class="sample-area">
                                <div class="sample-label">📖 前頁例詞</div>
                                <div>${frontSample.map(p => `<span class="word-chip">${p.word}</span>`).join('')}</div>
                                <div class="word-count-badge">📚 共 ${totalCount} 個單字</div>
                                <button class="view-list-btn" data-blend="${item.blend}">📋 清單檢視 (完整列表)</button>
                            </div>
                            <div class="flip-hint">✨ 點擊卡片翻轉 → 查看剩餘單字 ✨</div>
                        </div>
                        <div class="card-back">
                            <div class="blend-title" style="font-size:1.8rem;">${item.blend} <span style="font-size:0.9rem;">後頁單字</span></div>
                            ${hasBack ? backWords.map(p => `
                                <div class="word-item-list">
                                    <div class="word-left">
                                        <span class="word-en">${p.word}</span>
                                        <button class="speaker-btn" data-word="${p.word}">🔊</button>
                                        <span class="word-zh">${p.meaning}</span>
                                    </div>
                                </div>
                            `).join('') : '<div style="padding:1rem; text-align:center; color:#9aaebf;">✨ 後頁暫無更多單字 ✨</div>'}
                            <div class="flip-hint" style="margin-top:1rem;">↺ 點擊翻回正面</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // 綁定翻轉事件
        document.querySelectorAll('.flashcard').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('speaker-btn') || e.target.classList.contains('view-list-btn')) return;
                card.classList.toggle('flipped');
            });
        });
        // 綁定發音按鈕
        document.querySelectorAll('.speaker-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const word = btn.getAttribute('data-word');
                if (word) speakWord(word);
            });
        });
        // 綁定「清單檢視」按鈕 (modal)
        document.querySelectorAll('.view-list-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const blendName = btn.getAttribute('data-blend');
                openModal(blendName);
            });
        });
    }

    function openModal(blendKey) {
        const item = blendsData.find(b => b.blend === blendKey);
        if (!item) return;
        const pairs = getWordPairs(item);
        const modal = document.getElementById("wordModal");
        document.getElementById("modalBlendTitle").innerHTML = `${item.blend} 完整單字表`;
        const container = document.getElementById("modalWordList");
        container.innerHTML = pairs.map(p => `
            <div class="word-item-list" style="display:flex; justify-content:space-between;">
                <div class="word-left">
                    <span class="word-en">${p.word}</span>
                    <button class="speaker-btn" data-word="${p.word}">🔊</button>
                    <span class="word-zh">${p.meaning}</span>
                </div>
            </div>
        `).join('');
        // 重新綁定模態框內發音
        container.querySelectorAll('.speaker-btn').forEach(btn => {
            btn.addEventListener('click', () => speakWord(btn.getAttribute('data-word')));
        });
        modal.style.display = "flex";
    }

    function closeModal() { document.getElementById("wordModal").style.display = "none"; }

    // 建立字母過濾欄 (只顯示子音字母)
function buildAlphaBar() {
    const allLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
    const vowels = ['A', 'E', 'I', 'O', 'U'];  // 母音字母
    const consonants = allLetters.filter(letter => !vowels.includes(letter));  // 只保留子音
    const container = document.getElementById("alphaFilter");
    container.innerHTML = `<button class="alpha-btn" data-letter="ALL">ALL</button>` + 
        consonants.map(l => `<button class="alpha-btn" data-letter="${l}">${l}</button>`).join('');
    
    document.querySelectorAll('.alpha-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const letter = btn.dataset.letter;
            if (letter === "ALL") currentFilter = "";
            else currentFilter = letter;
            setAlphaFilter(currentFilter === "" ? "ALL" : currentFilter);
            document.getElementById('searchInput').value = '';
        });
    });
}

    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    window.addEventListener("click", (e) => { if (e.target === document.getElementById("wordModal")) closeModal(); });
    document.getElementById("searchInput").addEventListener("input", (e) => { 
        currentFilter = "";
        document.querySelectorAll('.alpha-btn').forEach(btn => btn.classList.remove('active'));
        renderCards(e.target.value);
    });
    buildAlphaBar();
    renderCards();
</script>
</body>
</html>
