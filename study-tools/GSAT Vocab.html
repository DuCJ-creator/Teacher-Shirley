<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Shirley's GSAT Vocab Practice | 修復版</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0891b2 100%);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #tsparticles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      z-index: 10;
    }

    .accent-gradient {
      background: linear-gradient(90deg, #22d3ee, #3b82f6);
    }

    .accent-text {
      background: linear-gradient(90deg, #67e8f9, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .option-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.15);
    }

    .option-btn.selected {
      background: linear-gradient(90deg, #22d3ee, #3b82f6);
      border-color: transparent;
      font-weight: 600;
      color: #0f172a;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
    }

    .option-btn.selected .option-letter {
      border-color: rgba(0,0,0,0.3);
      color: #0f172a;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }

    .timer-bar { transition: width 1s linear; }
    .fade-in { animation: fadeIn 0.6s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* lunar badge */
    .lunar-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #e5e7eb;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      pointer-events: none;
      user-select: none;
    }
    .lunar-badge.linked {
      color: #bbf7d0;
      border-color: rgba(16,185,129,0.35);
      background: rgba(16,185,129,0.12);
      box-shadow: 0 6px 18px rgba(16,185,129,0.2);
    }

    /* 修正顯示區域的斷行 */
    #q-text {
      word-break: break-word;
      white-space: pre-wrap;
    }
    .option-btn {
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
    }

    @media print {
      @page { margin: 0.6cm; }
      body {
        background: white !important;
        color: black !important;
        animation: none !important;
      }
      #tsparticles, .no-print, button, .lunar-badge { display: none !important; }
      #app-container {
        background: white !important;
        border: none !important;
        box-shadow: none !important;
      }
      #results-screen .text-center {
        color: black !important;
      }
      #feedback-list > div {
        break-inside: avoid;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>

<body class="flex items-center justify-center p-4 relative">

  <div id="lunar-badge" class="lunar-badge">🌙 請從月光寶盒進入</div>
  <div id="tsparticles"></div>

  <div id="app-container" class="w-full max-w-3xl glass-card rounded-3xl p-8 md:p-10 relative min-h-[550px] flex flex-col justify-center border-t-white/40">

    <!-- 載入畫面 -->
    <div id="loading-screen" class="text-center no-print">
      <div class="animate-spin rounded-full h-14 w-14 border-b-4 border-cyan-400 mx-auto mb-6"></div>
      <p class="text-xl tracking-widest text-cyan-200 font-light uppercase">Initializing System...</p>
      <p id="loading-sub" class="text-sm text-blue-200/70 mt-3">Connecting to data source...</p>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="text-center hidden fade-in no-print">
      <div class="mb-6 inline-block p-3 rounded-full bg-white/10 backdrop-blur-md">
        <i class="fas fa-brain text-4xl accent-text"></i>
      </div>
      <h1 class="text-5xl md:text-6xl font-extrabold mb-4 tracking-tight text-white drop-shadow-lg">
        Shirley's <span class="accent-text">GSAT Vocab Practice</span>
      </h1>
      <p class="text-blue-100 mb-10 text-lg font-light tracking-wide">
        Advanced Interactive Practice Engine (with acknowledgement of CEEC)
      </p>
      <div class="flex justify-center gap-4 mb-10 text-sm font-medium text-blue-200/80">
        <div class="flex items-center bg-blue-950/30 px-4 py-2 rounded-full border border-blue-400/20">
          <i class="fas fa-bolt text-cyan-400 mr-2"></i> 10 Questions
        </div>
        <div class="flex items-center bg-blue-950/30 px-4 py-2 rounded-full border border-blue-400/20">
          <i class="fas fa-stopwatch text-blue-400 mr-2"></i> 30s Timer
        </div>
      </div>
      <button onclick="startQuiz()" class="group relative px-10 py-4 rounded-full overflow-hidden transition-all hover:scale-105 active:scale-95 shadow-xl shadow-cyan-500/30 bg-white/10 backdrop-blur-lg border border-white/30">
        <div class="absolute inset-0 w-full h-full accent-gradient opacity-80 group-hover:opacity-100 transition-opacity"></div>
        <span class="relative text-white font-bold text-xl tracking-wider flex items-center justify-center">
          START MODULE <i class="fas fa-chevron-right ml-3 text-sm group-hover:translate-x-1 transition-transform"></i>
        </span>
      </button>
    </div>

    <!-- 答題畫面 -->
    <div id="quiz-screen" class="hidden fade-in w-full no-print">
      <div class="flex justify-between items-end mb-4">
        <div>
          <span class="text-xs font-mono text-blue-300 tracking-widest uppercase mb-1 block opacity-70">Progress</span>
          <span class="text-2xl font-bold text-white">
            Q<span id="q-current">1</span><span class="text-lg text-blue-300/70 font-medium">/10</span>
          </span>
        </div>
        <div class="text-right">
          <span class="text-xs font-mono text-blue-300 tracking-widest uppercase mb-1 block opacity-70">Time Left</span>
          <span id="timer-text" class="font-mono text-3xl font-bold accent-text drop-shadow">30s</span>
        </div>
      </div>

      <div class="w-full h-2 bg-blue-950/50 rounded-full mb-8 overflow-hidden p-[2px] border border-white/10">
        <div id="timer-bar" class="h-full rounded-full accent-gradient w-full timer-bar shadow-[0_0_10px_rgba(34,211,238,0.5)]"></div>
      </div>

      <div class="mb-8 relative z-10">
        <span id="q-code" class="inline-block px-3 py-1 bg-blue-500/20 border border-blue-400/30 rounded-lg text-xs text-blue-200 mb-4 tracking-wider font-mono">CODE: --</span>
        <h2 id="q-text" class="text-2xl md:text-3xl font-medium leading-relaxed text-white drop-shadow-md">等待題目載入...</h2>
      </div>

      <div id="options-container" class="grid grid-cols-1 gap-4 relative z-10"></div>
    </div>

    <!-- 結果畫面 -->
    <div id="results-screen" class="hidden fade-in w-full">
      <div class="text-center mb-8">
        <div class="inline-block p-3 rounded-full bg-white/10 backdrop-blur-md mb-4 no-print">
          <i class="fas fa-clipboard-check text-4xl accent-text"></i>
        </div>
        <h2 class="text-3xl font-bold mb-2 text-white">Session Analysis</h2>
        <div class="flex items-center justify-center gap-4 mt-6">
          <div class="text-6xl font-extrabold accent-text drop-shadow-xl">
            <span id="score-display">0</span><span class="text-4xl align-super">%</span>
          </div>
          <div class="text-left text-sm text-blue-200 uppercase tracking-wider leading-tight opacity-80">
            Correct<br>Rate
          </div>
        </div>
      </div>
      <div id="feedback-list" class="space-y-4 mb-8 max-h-[350px] overflow-y-auto pr-3 custom-scrollbar"></div>
      <div class="flex flex-col md:flex-row gap-4 justify-center mt-8 no-print">
        <button onclick="startQuiz(true)" class="px-8 py-4 rounded-2xl accent-gradient text-blue-950 font-extrabold shadow-lg shadow-cyan-500/25 transition-all hover:-translate-y-1 flex items-center justify-center">
          <i class="fas fa-redo-alt mr-3"></i> Next Challenge
        </button>
        <button onclick="window.print()" class="px-8 py-4 rounded-2xl bg-blue-500/20 hover:bg-blue-500/30 text-blue-200 font-bold transition-all border border-blue-400/30 flex items-center justify-center backdrop-blur-md">
          <i class="fas fa-print mr-3"></i> Print Results
        </button>
        <button onclick="exitApp()" class="px-8 py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-bold transition-colors border border-white/20 flex items-center justify-center backdrop-blur-md">
          <i class="fas fa-power-off mr-3 text-red-400"></i> Exit
        </button>
      </div>
    </div>

  </div>

  <script>
    (function initLunarBadge(){
      const badge = document.getElementById("lunar-badge");
      const linked = !!window.opener;
      if (linked) {
        badge.classList.add("linked");
        badge.textContent = "🌙 月光任務已連線";
      } else {
        badge.textContent = "🌙 請從月光寶盒進入";
      }
    })();

    // --- Particle System
    async function initParticles() {
      try {
        await tsParticles.load("tsparticles", {
          particles: {
            number: { value: 50, density: { enable: true, value_area: 800 } },
            color: { value: ["#67e8f9", "#ffffff", "#3b82f6"] },
            shape: { type: "circle" },
            opacity: { value: 0.35, random: true },
            size: { value: 1.8, random: true },
            links: { enable: true, distance: 150, color: "#ffffff", opacity: 0.12, width: 1 },
            move: { enable: true, speed: 0.7, direction: "none", random: true, straight: false, out_mode: "out" }
          },
          interactivity: {
            detect_on: "canvas",
            events: { onhover: { enable: true, mode: "grab" }, resize: true },
            modes: { grab: { distance: 160, line_linked: { opacity: 0.3 } } }
          },
          retina_detect: true,
          background: { color: "transparent" }
        });
      } catch(e){ console.warn(e); }
    }

    // ---------- 核心資料 ----------
    const CSV_CANDIDATES = [
      'https://ducj-creator.github.io/GSAT%20vocab%20fixed%20option%20quiz.csv',
      'https://ducj-creator.github.io/Teacher-Shirley/GSAT%20vocab%20fixed%20option%20quiz.csv'
    ];
    const QUESTION_LIMIT = 10;
    const TIME_LIMIT = 30;

    let allQuestions = [];          // 儲存所有題目物件
    let wrongHistory = new Set();   // 錯題索引 (包含超時)
    let seenHistory = new Set();    // 出現過的題目索引

    let currentSession = {
      questions: [],
      userAnswers: [],    // 儲存選擇的選項索引 (0~3) 或 null
      currentIndex: 0,
      timer: null,
      timeLeft: TIME_LIMIT
    };

    // ---------- 載入 CSV + 嚴謹解析 (解決 code/question/options 空白問題) ----------
    async function loadData() {
      const loadingDiv = document.getElementById('loading-screen');
      const loadingSub = document.getElementById('loading-sub');
      const startDiv = document.getElementById('start-screen');

      for (let attempt = 0; attempt < CSV_CANDIDATES.length; attempt++) {
        const baseUrl = CSV_CANDIDATES[attempt];
        const url = baseUrl + (baseUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
        try {
          loadingSub.textContent = `正在嘗試來源 ${attempt+1}/${CSV_CANDIDATES.length} : ${baseUrl.split('/').pop()}`;
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const csvText = await response.text();
          
          // 重要: PapaParse 設定 header: false，但我們要手動過濾空行、前後空白
          const parseResult = Papa.parse(csvText, {
            header: false,
            skipEmptyLines: true,
            trimHeaders: false,   // 我們自行 trim 每個欄位
          });
          
          if (parseResult.errors && parseResult.errors.length) {
            console.warn("Parse warnings", parseResult.errors);
          }
          
          const rows = parseResult.data;
          if (!rows || rows.length < 2) throw new Error("CSV 無有效資料");
          
          // 重建題庫：預期欄位 0: CODE, 1: 題幹, 2: 選項A, 3: 選項B, 4: 選項C, 5: 選項D, 6: 正確答案文字
          const tempQuestions = [];
          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 7) continue;  // 欄位不足跳過
            // 確實 trim 每個欄位，避免空格影響顯示
            const code = (row[0] !== undefined ? String(row[0]).trim() : "");
            const text = (row[1] !== undefined ? String(row[1]).trim() : "");
            const optA = (row[2] !== undefined ? String(row[2]).trim() : "");
            const optB = (row[3] !== undefined ? String(row[3]).trim() : "");
            const optC = (row[4] !== undefined ? String(row[4]).trim() : "");
            const optD = (row[5] !== undefined ? String(row[5]).trim() : "");
            const correctAns = (row[6] !== undefined ? String(row[6]).trim() : "");
            
            // 過濾無效題目: 題幹不能為空，正確答案不能為空，選項不能全空
            if (!text || !correctAns) continue;
            const options = [optA, optB, optC, optD];
            if (options.every(opt => opt === "")) continue;
            
            tempQuestions.push({
              originalIndex: i,
              code: code || `Q${i+1}`,
              text: text,
              options: options,
              correctAnswer: correctAns
            });
          }
          
          if (tempQuestions.length === 0) throw new Error("CSV 解析後無任何有效題目");
          
          allQuestions = tempQuestions;
          console.log(`成功載入 ${allQuestions.length} 題，來源: ${baseUrl}`);
          
          // 載入成功，隱藏loading顯示開始畫面
          loadingDiv.classList.add('hidden');
          startDiv.classList.remove('hidden');
          return;
          
        } catch (err) {
          console.error(`CSV載入失敗 (${attempt+1}):`, err);
          loadingSub.textContent = `來源 ${attempt+1} 失敗: ${err.message}，嘗試下一個...`;
        }
      }
      
      // 所有來源皆失敗
      loadingDiv.innerHTML = `
        <div class="text-center">
          <div class="text-5xl mb-4">⚠️</div>
          <p class="text-xl text-rose-200 font-bold">資料載入錯誤</p>
          <p class="text-sm text-blue-100/80 mt-2">無法讀取 CSV 檔案，請確認網路或檔案路徑。</p>
          <div class="bg-black/30 p-3 rounded-xl text-left text-xs text-blue-200 mt-5">
            <p class="font-mono">嘗試過的位址：</p>
            ${CSV_CANDIDATES.map(u => `<div class="break-all">- ${u}</div>`).join('')}
            <p class="mt-2">請確保 CSV 格式為: 代碼,題幹,選項A,選項B,選項C,選項D,正確答案</p>
          </div>
          <button onclick="location.reload()" class="mt-6 px-5 py-2 bg-white/20 rounded-full text-white">重新載入</button>
        </div>
      `;
    }

    // ---------- 輔助: 洗牌 ----------
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // ---------- 啟動測驗 (nextChallenge 沿用錯題策略) ----------
    function startQuiz(isNextChallenge = false) {
      if (!allQuestions.length) {
        alert("題庫尚未載入，請稍後或重新整理。");
        return;
      }
      
      let pool = [];
      if (isNextChallenge) {
        // 優先錯題池 (含超時)
        const wrongPool = allQuestions.filter(q => wrongHistory.has(q.originalIndex));
        shuffleArray(wrongPool);
        // 從未看過 (不在錯題池且不在看過池)
        const unseenPool = allQuestions.filter(q => !seenHistory.has(q.originalIndex) && !wrongHistory.has(q.originalIndex));
        shuffleArray(unseenPool);
        pool = [...wrongPool, ...unseenPool];
        
        if (pool.length < QUESTION_LIMIT) {
          // 補上曾經看過但非錯題的 (已熟題)
          const mastered = allQuestions.filter(q => seenHistory.has(q.originalIndex) && !wrongHistory.has(q.originalIndex));
          shuffleArray(mastered);
          pool = pool.concat(mastered);
        }
      } else {
        // 初次隨機
        pool = [...allQuestions];
        shuffleArray(pool);
      }
      
      // 取前 QUESTION_LIMIT 題
      currentSession.questions = pool.slice(0, QUESTION_LIMIT);
      currentSession.userAnswers = new Array(currentSession.questions.length).fill(null);
      currentSession.currentIndex = 0;
      
      // 記錄看過 (讓下一輪錯題策略更精準)
      currentSession.questions.forEach(q => seenHistory.add(q.originalIndex));
      
      // 切換畫面
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('results-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      
      loadQuestion(0);
    }
    
    // ---------- 載入指定題目 (徹底解決顯示問題) ----------
    function loadQuestion(index) {
      // 清除前一個計時器
      if (currentSession.timer) {
        clearInterval(currentSession.timer);
        currentSession.timer = null;
      }
      
      const qData = currentSession.questions[index];
      if (!qData) {
        console.error("題目不存在", index);
        return;
      }
      
      // 更新 UI 元素
      document.getElementById('q-current').innerText = index + 1;
      const codeSpan = document.getElementById('q-code');
      codeSpan.innerText = qData.code ? `CODE: ${qData.code}` : `CODE: ${index+1}`;
      
      const questionTextEl = document.getElementById('q-text');
      // 確保題幹有內容，如果題幹空白就顯示佔位符 (防止空白)
      questionTextEl.innerText = qData.text && qData.text.trim() !== "" ? qData.text : "(題幹未提供)";
      
      // 重置計時顯示
      currentSession.timeLeft = TIME_LIMIT;
      document.getElementById('timer-text').innerText = `${TIME_LIMIT}s`;
      document.getElementById('timer-text').classList.add('accent-text');
      document.getElementById('timer-text').classList.remove('text-red-400');
      
      const timerBar = document.getElementById('timer-bar');
      timerBar.style.transition = 'none';
      timerBar.style.width = '100%';
      
      // 渲染選項按鈕
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      
      const optionsArray = qData.options;
      for (let i = 0; i < optionsArray.length; i++) {
        const optText = optionsArray[i];
        // 防止選項為空字串，但保留原本文字 (若有空選項仍顯示，但避免顯示 undefined)
        const displayText = (optText && optText !== "") ? optText : `(選項 ${String.fromCharCode(65+i)})`;
        const btn = document.createElement('button');
        btn.className = `option-btn w-full text-left p-5 rounded-2xl text-gray-100 text-lg font-medium flex items-center group`;
        btn.innerHTML = `
          <span class="option-letter inline-flex items-center justify-center w-8 h-8 rounded-full border-2 border-white/30 text-sm font-bold mr-4 text-blue-200 group-hover:border-cyan-400 group-hover:text-cyan-400 transition-colors">
            ${String.fromCharCode(65+i)}
          </span> 
          <span class="flex-1">${escapeHtml(displayText)}</span>
        `;
        btn.onclick = (function(optIdx) {
          return function() { selectOption(optIdx, btn); };
        })(i);
        optsContainer.appendChild(btn);
      }
      
      // 觸發重排後開始計時條動畫
      setTimeout(() => {
        timerBar.style.transition = `width ${TIME_LIMIT}s linear`;
        timerBar.style.width = '0%';
      }, 50);
      
      // 計時器
      currentSession.timer = setInterval(() => {
        if (currentSession.timeLeft <= 1) {
          if (currentSession.timer) clearInterval(currentSession.timer);
          currentSession.timeLeft = 0;
          document.getElementById('timer-text').innerText = `0s`;
          // 時間到，不記錄答案 (保持null)，直接下一題
          handleNext();
        } else {
          currentSession.timeLeft--;
          document.getElementById('timer-text').innerText = `${currentSession.timeLeft}s`;
          if (currentSession.timeLeft <= 5) {
            document.getElementById('timer-text').classList.remove('accent-text');
            document.getElementById('timer-text').classList.add('text-red-400');
          }
        }
      }, 1000);
    }
    
    // 輔助防 XSS
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
        return c;
      });
    }
    
    function selectOption(optIndex, btnElement) {
      // 避免重複作答
      if (currentSession.userAnswers[currentSession.currentIndex] !== null) return;
      
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');
      
      // 記錄答案
      currentSession.userAnswers[currentSession.currentIndex] = optIndex;
      
      // 停止計時器
      if (currentSession.timer) {
        clearInterval(currentSession.timer);
        currentSession.timer = null;
      }
      // 延遲進入下一題
      setTimeout(() => handleNext(), 300);
    }
    
    function handleNext() {
      const nextIdx = currentSession.currentIndex + 1;
      if (nextIdx < currentSession.questions.length) {
        loadQuestion(nextIdx);
      } else {
        finishQuiz();
      }
    }
    
    // ---------- 結算畫面，修正錯題池與正確率 ----------
    function finishQuiz() {
      if (currentSession.timer) clearInterval(currentSession.timer);
      
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('results-screen').classList.remove('hidden');
      
      const listContainer = document.getElementById('feedback-list');
      listContainer.innerHTML = '';
      
      let correctCount = 0;
      
      currentSession.questions.forEach((q, idx) => {
        const userChoiceIdx = currentSession.userAnswers[idx];
        let isCorrect = false;
        let userChoiceText = "Time Out / No Answer";
        
        if (userChoiceIdx !== null && q.options[userChoiceIdx] !== undefined) {
          userChoiceText = q.options[userChoiceIdx];
          // 正確比對：選項文字完全等於正確答案
          if (userChoiceText === q.correctAnswer) {
            isCorrect = true;
          }
        }
        
        if (isCorrect) {
          correctCount++;
          // 若答對且之前被記錯，移除錯題記錄
          if (wrongHistory.has(q.originalIndex)) wrongHistory.delete(q.originalIndex);
        } else {
          // 超時或答錯 -> 加入錯題池
          wrongHistory.add(q.originalIndex);
        }
        
        // 建立回饋卡片 (填空強調)
        let sentenceWithAnswer = q.text;
        if (sentenceWithAnswer.includes('___') || sentenceWithAnswer.includes('____') || sentenceWithAnswer.includes('______')) {
          sentenceWithAnswer = sentenceWithAnswer.replace(/_{2,}/g, `<span class="text-emerald-300 font-bold border-b-2 border-emerald-300/50 px-1">${escapeHtml(q.correctAnswer)}</span>`);
        } else {
          // 若無底線，附加正確答案提示
          sentenceWithAnswer = `${sentenceWithAnswer} <span class="text-cyan-300 text-sm ml-2">(正確: ${escapeHtml(q.correctAnswer)})</span>`;
        }
        
        const plainTextForTTS = q.text.replace(/_{2,}/g, q.correctAnswer);
        
        const cardDiv = document.createElement('div');
        cardDiv.className = `p-5 rounded-2xl border backdrop-blur-sm transition-all ${isCorrect ? 'border-emerald-400/30 bg-emerald-900/20' : 'border-rose-400/30 bg-rose-900/20'}`;
        cardDiv.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="text-xs font-mono text-blue-200/60 bg-blue-950/50 px-2 py-1 rounded">${escapeHtml(q.code)}</span>
            <span class="text-xs font-extrabold px-3 py-1 rounded-full tracking-wider ${isCorrect ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}">
              ${isCorrect ? '<i class="fas fa-check mr-1"></i> CORRECT' : '<i class="fas fa-times mr-1"></i> WRONG'}
            </span>
          </div>
          <p class="text-lg mb-3 leading-relaxed text-white/90 font-medium">${sentenceWithAnswer}</p>
          ${!isCorrect ? `<div class="text-sm text-rose-300 mb-2 bg-rose-950/30 p-2 rounded-lg"><i class="fas fa-arrow-right mr-2"></i>Your choice: <span class="font-bold">${escapeHtml(userChoiceText)}</span></div>` : ''}
          <button onclick="speakText(this, '${escapeHtml(plainTextForTTS).replace(/'/g, "\\'")}')" class="text-sm px-4 py-2 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 text-blue-300 transition-colors flex items-center gap-2 border border-blue-400/20">
            <i class="fas fa-volume-high"></i> Play Audio
          </button>
        `;
        listContainer.appendChild(cardDiv);
      });
      
      // 傳送結果至父視窗 (月光任務)
      const finalScorePercent = Math.round((correctCount / QUESTION_LIMIT) * 100);
      const resultMsg = {
        type: "LUNAR_MISSION_RESULT",
        correct: correctCount,
        mission: "GSAT 真題"
      };
      if (window.opener) {
        window.opener.postMessage(resultMsg, "*");
      }
      localStorage.setItem("lunar_pending_result", JSON.stringify(resultMsg));
      
      animateValue(document.getElementById('score-display'), 0, finalScorePercent, 1200);
    }
    
    // 數字動畫
    function animateValue(obj, start, end, duration) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerText = Math.floor(progress * (end - start) + start);
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    
    // TTS 功能
    window.speakText = function(btn, text) {
      if (!text) return;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = `<i class="fas fa-wave-square animate-pulse text-cyan-400"></i> Speaking...`;
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.onend = () => {
          btn.innerHTML = originalHtml;
        };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音");
        btn.innerHTML = originalHtml;
      }
    };
    
    function exitApp() {
      location.reload();
    }
    
    // 全域初始化
    document.addEventListener('DOMContentLoaded', () => {
      initParticles();
      loadData();
    });
  </script>
</body>
</html>
