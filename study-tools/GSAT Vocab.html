<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Shirley's GSAT Vocab Practice | 修復版</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>

  <style>
    html { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #020408 0%, #05081a 20%, #0a0e2a 40%, #0d0628 60%, #050d1f 80%, #020408 100%);
      background-size: 400% 400%;
      animation: gradientBG 30s ease infinite;
      color: #fff;
      height: 100vh;
      height: 100dvh; /* dynamic viewport height: avoids mobile browser chrome causing scroll */
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.5rem, 2vh, 1.25rem);
      box-sizing: border-box;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(ellipse at center, rgba(88, 28, 220, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -15%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse at center, rgba(6, 78, 160, 0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #tsparticles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(8, 15, 40, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(120, 160, 255, 0.18);
      box-shadow: 0 8px 48px 0 rgba(0, 0, 0, 0.5), 0 0 80px rgba(80, 60, 180, 0.08), inset 0 1px 0 rgba(255,255,255,0.06);
      z-index: 10;
    }

    .accent-gradient {
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    }

    .accent-text {
      background: linear-gradient(90deg, #c4b5fd, #93c5fd, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .option-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(20, 25, 60, 0.5);
      border: 1px solid rgba(120, 100, 255, 0.18);
    }

    .option-btn:hover {
      background: rgba(80, 60, 160, 0.3);
      transform: translateY(-2px);
      border-color: rgba(167, 139, 250, 0.5);
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
    }

    .option-btn.selected {
      background: linear-gradient(90deg, #7c3aed, #3b82f6);
      border-color: transparent;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 0 24px rgba(124, 58, 237, 0.5);
    }

    .option-btn.selected .option-letter {
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }

    .timer-bar { transition: width 1s linear; }
    .fade-in { animation: fadeIn 0.6s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 修正顯示區域的斷行 */
    #q-text {
      word-break: break-word;
      white-space: pre-wrap;
    }
    .option-btn {
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
    }

    /* ================================================================
       一頁式版面：整頁固定在 100dvh 內，不需捲動整個網頁。
       所有文字/間距改用 clamp() 依視窗高度(vh)自動縮放，
       確保在小螢幕、筆電、平板上都能一次完整顯示。
       ================================================================ */
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 48rem;
      height: 100%;
      max-height: 100%;
      padding: clamp(0.9rem, 3.2vh, 2.25rem) clamp(1rem, 4vw, 2.5rem);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 只在畫面「顯示中」(沒有 hidden class) 時才套用 flex 排版，
       避免蓋掉 Tailwind 的 .hidden { display:none } 邏輯 */
    #start-screen:not(.hidden),
    #quiz-screen:not(.hidden),
    #results-screen:not(.hidden) {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    #start-screen:not(.hidden)  { justify-content: center; align-items: center; }
    #quiz-screen:not(.hidden)   { justify-content: flex-start; }
    #results-screen:not(.hidden){ justify-content: flex-start; }

    /* 開始畫面：所有元素隨視窗高度縮放 */
    .app-icon-wrap { margin-bottom: clamp(0.4rem, 1.6vh, 1.25rem); }
    .app-icon-wrap i { font-size: clamp(1.6rem, 4vh, 2.25rem) !important; }
    .app-title {
      font-size: clamp(1.35rem, 5.2vh, 3rem);
      line-height: 1.15;
      margin-bottom: clamp(0.4rem, 1.4vh, 1rem);
    }
    .app-subtitle {
      font-size: clamp(0.75rem, 2vh, 1.125rem);
      margin-bottom: clamp(0.6rem, 2vh, 2.5rem);
    }
    .app-badges {
      margin-bottom: clamp(0.6rem, 2vh, 2.5rem);
      font-size: clamp(0.65rem, 1.5vh, 0.875rem);
    }
    .start-btn {
      padding: clamp(0.55rem, 1.8vh, 1rem) clamp(1.5rem, 5vw, 2.5rem) !important;
      font-size: clamp(0.9rem, 2vh, 1.25rem);
    }

    /* 答題畫面 */
    #quiz-screen .quiz-header { margin-bottom: clamp(0.5rem, 1.6vh, 1rem); }
    #quiz-screen .quiz-progress-wrap { margin-bottom: clamp(0.6rem, 2vh, 2rem); }
    #q-code { font-size: clamp(0.6rem, 1.3vh, 0.75rem); margin-bottom: clamp(0.4rem, 1.4vh, 1rem) !important; }
    #q-text { font-size: clamp(0.95rem, 3vh, 1.875rem) !important; }
    .q-block { margin-bottom: clamp(0.5rem, 1.6vh, 2rem); }

    #options-container {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      align-content: center;
      gap: clamp(0.4rem, 1.4vh, 1rem) !important;
    }
    .option-btn {
      padding: clamp(0.5rem, 1.6vh, 1.25rem) clamp(0.75rem, 2.5vw, 1.25rem) !important;
      font-size: clamp(0.8rem, 1.9vh, 1.125rem) !important;
    }
    .option-letter {
      width: clamp(1.4rem, 3vh, 2rem) !important;
      height: clamp(1.4rem, 3vh, 2rem) !important;
      font-size: clamp(0.65rem, 1.4vh, 0.875rem) !important;
      margin-right: clamp(0.5rem, 1.6vw, 1rem) !important;
    }

    /* 結果畫面 */
    #results-screen .results-header { margin-bottom: clamp(0.5rem, 1.6vh, 2rem); }
    #results-screen h2 { font-size: clamp(1.25rem, 3.6vh, 1.875rem) !important; }
    #score-display { font-size: clamp(1.9rem, 6.5vh, 3.75rem); }
    .app-score-percent { font-size: clamp(1.1rem, 4vh, 2.25rem); }

    #feedback-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }

    .results-actions {
      margin-top: clamp(0.5rem, 2vh, 2rem) !important;
    }
    .results-actions button {
      padding: clamp(0.55rem, 1.8vh, 1rem) clamp(1rem, 3vw, 2rem) !important;
      font-size: clamp(0.8rem, 1.7vh, 1rem) !important;
    }

    @media print {
      @page { margin: 0.6cm; }
      html, body {
        height: auto !important;
        overflow: visible !important;
      }
      body {
        background: white !important;
        color: black !important;
        animation: none !important;
        display: block !important;
        padding: 0 !important;
      }
      #tsparticles, .no-print, button, .lunar-badge { display: none !important; }
      #app-container {
        background: white !important;
        border: none !important;
        box-shadow: none !important;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      #results-screen:not(.hidden) { height: auto !important; }
      #feedback-list {
        max-height: none !important;
        overflow: visible !important;
      }
      #results-screen .text-center {
        color: black !important;
      }
      #feedback-list > div {
        break-inside: avoid;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>

<body class="relative">

  <div id="tsparticles"></div>

  <div id="app-container" class="glass-card rounded-3xl relative border-t-white/40">

    <!-- 載入畫面 -->
    <div id="loading-screen" class="text-center no-print">
      <div class="animate-spin rounded-full h-14 w-14 border-b-4 border-cyan-400 mx-auto mb-6"></div>
      <p class="text-xl tracking-widest text-cyan-200 font-light uppercase">Initializing System...</p>
      <p id="loading-sub" class="text-sm text-blue-200/70 mt-3">Connecting to data source...</p>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="text-center hidden fade-in no-print">
      <div class="app-icon-wrap inline-block p-3 rounded-full bg-white/10 backdrop-blur-md">
        <i class="fas fa-brain text-4xl accent-text"></i>
      </div>
      <h1 class="app-title font-extrabold tracking-tight text-white drop-shadow-lg">
        Shirley's <span class="accent-text">GSAT Vocab Practice</span>
      </h1>
      <p class="app-subtitle text-blue-100 font-light tracking-wide">
        Advanced Interactive Practice Engine (with acknowledgement of CEEC)
      </p>
      <div class="app-badges flex justify-center gap-4 font-medium text-blue-200/80">
        <div class="flex items-center bg-blue-950/30 px-4 py-2 rounded-full border border-blue-400/20">
          <i class="fas fa-bolt text-cyan-400 mr-2"></i> 10 Questions
        </div>
        <div class="flex items-center bg-blue-950/30 px-4 py-2 rounded-full border border-blue-400/20">
          <i class="fas fa-stopwatch text-blue-400 mr-2"></i> 30s Timer
        </div>
      </div>
      <button id="start-quiz-btn" class="start-btn group relative rounded-full overflow-hidden transition-all hover:scale-105 active:scale-95 shadow-xl shadow-cyan-500/30 bg-white/10 backdrop-blur-lg border border-white/30">
        <div class="absolute inset-0 w-full h-full accent-gradient opacity-80 group-hover:opacity-100 transition-opacity"></div>
        <span class="relative text-white font-bold text-xl tracking-wider flex items-center justify-center">
          START MODULE <i class="fas fa-chevron-right ml-3 text-sm group-hover:translate-x-1 transition-transform"></i>
        </span>
      </button>
    </div>

    <!-- 答題畫面 -->
    <div id="quiz-screen" class="hidden fade-in w-full no-print">
      <div class="quiz-header flex justify-between items-end">
        <div>
          <span class="text-xs font-mono text-blue-300 tracking-widest uppercase mb-1 block opacity-70">Progress</span>
          <span class="text-2xl font-bold text-white">
            Q<span id="q-current">1</span><span class="text-lg text-blue-300/70 font-medium">/10</span>
          </span>
        </div>
        <div class="text-right">
          <span class="text-xs font-mono text-blue-300 tracking-widest uppercase mb-1 block opacity-70">Time Left</span>
          <span id="timer-text" class="font-mono text-3xl font-bold accent-text drop-shadow">30s</span>
        </div>
      </div>

      <div class="quiz-progress-wrap w-full h-2 bg-blue-950/50 rounded-full overflow-hidden p-[2px] border border-white/10">
        <div id="timer-bar" class="h-full rounded-full accent-gradient w-full timer-bar shadow-[0_0_12px_rgba(167,139,250,0.6)]"></div>
      </div>

      <div class="q-block relative z-10">
        <span id="q-code" class="inline-block px-3 py-1 bg-blue-500/20 border border-blue-400/30 rounded-lg text-xs text-blue-200 tracking-wider font-mono">CODE: --</span>
        <h2 id="q-text" class="font-medium leading-relaxed text-white drop-shadow-md">等待題目載入...</h2>
      </div>

      <div id="options-container" class="grid grid-cols-1 gap-4 relative z-10"></div>
    </div>

    <!-- 結果畫面 -->
    <div id="results-screen" class="hidden fade-in w-full">
      <div class="results-header text-center">
        <div class="inline-block p-3 rounded-full bg-white/10 backdrop-blur-md mb-4 no-print">
          <i class="fas fa-clipboard-check text-4xl accent-text"></i>
        </div>
        <h2 class="font-bold mb-2 text-white">Session Analysis</h2>
        <div class="flex items-center justify-center gap-4 mt-3">
          <div class="font-extrabold accent-text drop-shadow-xl">
            <span id="score-display">0</span><span class="app-score-percent align-super">%</span>
          </div>
          <div class="text-left text-sm text-blue-200 uppercase tracking-wider leading-tight opacity-80">
            Correct<br>Rate
          </div>
        </div>
      </div>
      <div id="feedback-list" class="space-y-4 pr-3 custom-scrollbar"></div>
      <div class="results-actions flex flex-col md:flex-row gap-4 justify-center no-print">
        <button id="next-challenge-btn" class="px-8 py-4 rounded-2xl accent-gradient text-blue-950 font-extrabold shadow-lg shadow-cyan-500/25 transition-all hover:-translate-y-1 flex items-center justify-center">
          <i class="fas fa-redo-alt mr-3"></i> Next Challenge
        </button>
        <button id="print-results-btn" class="px-8 py-4 rounded-2xl bg-blue-500/20 hover:bg-blue-500/30 text-blue-200 font-bold transition-all border border-blue-400/30 flex items-center justify-center backdrop-blur-md">
          <i class="fas fa-print mr-3"></i> Print Results
        </button>
        <button id="exit-app-btn" class="px-8 py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-bold transition-colors border border-white/20 flex items-center justify-center backdrop-blur-md">
          <i class="fas fa-power-off mr-3 text-red-400"></i> Exit
        </button>
      </div>
    </div>

  </div>

  <script>
    // --- 核心修復: 確保 loadQuestion 正確更新 currentIndex，且計時器與選項不再互相干擾 ---
    // 粒子系統
    async function initParticles() {
      try {
        await tsParticles.load("tsparticles", {
          particles: {
            number: { value: 120, density: { enable: true, value_area: 800 } },
            color: { value: ["#ffffff", "#c4b5fd", "#93c5fd", "#fde68a", "#6ee7b7", "#f9a8d4"] },
            shape: { type: "circle" },
            opacity: { value: 0.6, random: true, animation: { enable: true, speed: 0.5, minimumValue: 0.1, sync: false } },
            size: { value: 2, random: true, animation: { enable: true, speed: 1, minimumValue: 0.3, sync: false } },
            links: { enable: true, distance: 130, color: "#a78bfa", opacity: 0.07, width: 1 },
            move: { enable: true, speed: 0.4, direction: "none", random: true, straight: false, out_mode: "out", bounce: false }
          },
          interactivity: {
            detect_on: "canvas",
            events: { onhover: { enable: true, mode: ["grab", "bubble"] }, resize: true },
            modes: { grab: { distance: 160, line_linked: { opacity: 0.25 } }, bubble: { distance: 200, size: 4, duration: 2, opacity: 0.7 } }
          },
          retina_detect: true,
          background: { color: "transparent" }
        });
      } catch(e){ console.warn(e); }
    }

    // ---------- 核心資料 ----------
    const CSV_CANDIDATES = [
      'https://ducj-creator.github.io/GSAT%20vocab%20fixed%20option%20quiz.csv',
      'https://ducj-creator.github.io/Teacher-Shirley/GSAT%20vocab%20fixed%20option%20quiz.csv'
    ];
    const QUESTION_LIMIT = 10;
    const TIME_LIMIT = 30;

    let allQuestions = [];
    let wrongHistory = new Set();
    let seenHistory = new Set();

    let currentSession = {
      questions: [],
      userAnswers: [],     // 儲存每個題目用戶選擇的選項文字 (或是 null)
      currentIndex: 0,
      timer: null,
      timeLeft: TIME_LIMIT,
      isAnswerLocked: false  // 防止同一題重複作答
    };

    // 載入 CSV (與原邏輯相同但增強健壯性)
    async function loadData() {
      const loadingDiv = document.getElementById('loading-screen');
      const loadingSub = document.getElementById('loading-sub');
      const startDiv = document.getElementById('start-screen');

      for (let attempt = 0; attempt < CSV_CANDIDATES.length; attempt++) {
        const baseUrl = CSV_CANDIDATES[attempt];
        const url = baseUrl + (baseUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
        try {
          loadingSub.textContent = `正在嘗試來源 ${attempt+1}/${CSV_CANDIDATES.length} : ${baseUrl.split('/').pop()}`;
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const csvText = await response.text();
          
          const parseResult = Papa.parse(csvText, { header: false, skipEmptyLines: true });
          if (parseResult.errors && parseResult.errors.length) console.warn("Parse warnings", parseResult.errors);
          const rows = parseResult.data;
          if (!rows || rows.length < 2) throw new Error("CSV 無有效資料");
          
          const tempQuestions = [];
          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 7) continue;
            const code = (row[0] !== undefined ? String(row[0]).trim() : "");
            const text = (row[1] !== undefined ? String(row[1]).trim() : "");
            const optA = (row[2] !== undefined ? String(row[2]).trim() : "");
            const optB = (row[3] !== undefined ? String(row[3]).trim() : "");
            const optC = (row[4] !== undefined ? String(row[4]).trim() : "");
            const optD = (row[5] !== undefined ? String(row[5]).trim() : "");
            const correctAns = (row[6] !== undefined ? String(row[6]).trim() : "");
            if (!text || !correctAns) continue;
            const options = [optA, optB, optC, optD];
            if (options.every(opt => opt === "")) continue;
            tempQuestions.push({
              originalIndex: i,
              code: code || `Q${i+1}`,
              text: text,
              options: options,
              correctAnswer: correctAns
            });
          }
          if (tempQuestions.length === 0) throw new Error("CSV 解析後無任何有效題目");
          allQuestions = tempQuestions;
          console.log(`成功載入 ${allQuestions.length} 題`);
          loadingDiv.classList.add('hidden');
          startDiv.classList.remove('hidden');
          return;
        } catch (err) {
          console.error(`CSV載入失敗 (${attempt+1}):`, err);
          loadingSub.textContent = `來源 ${attempt+1} 失敗: ${err.message}，嘗試下一個...`;
        }
      }
      
      loadingDiv.innerHTML = `
        <div class="text-center">
          <div class="text-5xl mb-4">⚠️</div>
          <p class="text-xl text-rose-200 font-bold">資料載入錯誤</p>
          <p class="text-sm text-blue-100/80 mt-2">無法讀取 CSV 檔案，請確認網路或檔案路徑。</p>
          <div class="bg-black/30 p-3 rounded-xl text-left text-xs text-blue-200 mt-5">
            <p class="font-mono">嘗試過的位址：</p>
            ${CSV_CANDIDATES.map(u => `<div class="break-all">- ${u}</div>`).join('')}
          </div>
          <button onclick="location.reload()" class="mt-6 px-5 py-2 bg-white/20 rounded-full text-white">重新載入</button>
        </div>
      `;
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // 開始或重新挑戰
    function startQuiz(isNextChallenge = false) {
      if (!allQuestions.length) {
        alert("題庫尚未載入，請稍後或重新整理。");
        return;
      }
      
      let pool = [];
      if (isNextChallenge) {
        const wrongPool = allQuestions.filter(q => wrongHistory.has(q.originalIndex));
        shuffleArray(wrongPool);
        const unseenPool = allQuestions.filter(q => !seenHistory.has(q.originalIndex) && !wrongHistory.has(q.originalIndex));
        shuffleArray(unseenPool);
        pool = [...wrongPool, ...unseenPool];
        if (pool.length < QUESTION_LIMIT) {
          const mastered = allQuestions.filter(q => seenHistory.has(q.originalIndex) && !wrongHistory.has(q.originalIndex));
          shuffleArray(mastered);
          pool = pool.concat(mastered);
        }
      } else {
        pool = [...allQuestions];
        shuffleArray(pool);
      }
      
      currentSession.questions = pool.slice(0, QUESTION_LIMIT);
      currentSession.userAnswers = new Array(currentSession.questions.length).fill(null);
      currentSession.currentIndex = 0;
      currentSession.isAnswerLocked = false;
      if (currentSession.timer) {
        clearInterval(currentSession.timer);
        currentSession.timer = null;
      }
      
      // 記錄看過
      currentSession.questions.forEach(q => seenHistory.add(q.originalIndex));
      
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('results-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      
      loadQuestion(0);
    }
    
    // 核心修復：徹底重置計時器與鎖定狀態
    function loadQuestion(index) {
      // 清除舊計時器
      if (currentSession.timer) {
        clearInterval(currentSession.timer);
        currentSession.timer = null;
      }
      
      // 重置鎖定狀態
      currentSession.isAnswerLocked = false;
      
      const qData = currentSession.questions[index];
      if (!qData) {
        console.error("題目不存在");
        return;
      }
      
      // 更新 UI
      document.getElementById('q-current').innerText = index + 1;
      const codeSpan = document.getElementById('q-code');
      codeSpan.innerText = qData.code ? `CODE: ${qData.code}` : `CODE: ${index+1}`;
      const questionTextEl = document.getElementById('q-text');
      questionTextEl.innerText = qData.text && qData.text.trim() !== "" ? qData.text : "(題幹未提供)";
      
      // 重置時間顯示
      currentSession.timeLeft = TIME_LIMIT;
      const timerTextEl = document.getElementById('timer-text');
      timerTextEl.innerText = `${TIME_LIMIT}s`;
      timerTextEl.classList.add('accent-text');
      timerTextEl.classList.remove('text-red-400');
      
      const timerBar = document.getElementById('timer-bar');
      // 移除過渡效果重置寬度
      timerBar.style.transition = 'none';
      timerBar.style.width = '100%';
      // 強制重排後開始動畫
      void timerBar.offsetWidth;
      timerBar.style.transition = `width ${TIME_LIMIT}s linear`;
      timerBar.style.width = '0%';
      
      // 渲染選項
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      const optionsArray = qData.options;
      
      for (let i = 0; i < optionsArray.length; i++) {
        const optText = optionsArray[i];
        const displayText = (optText && optText !== "") ? optText : `(選項 ${String.fromCharCode(65+i)})`;
        const btn = document.createElement('button');
        btn.className = `option-btn w-full text-left p-5 rounded-2xl text-gray-100 text-lg font-medium flex items-center group`;
        btn.innerHTML = `
          <span class="option-letter inline-flex items-center justify-center w-8 h-8 rounded-full border-2 border-white/30 text-sm font-bold mr-4 text-blue-200 group-hover:border-cyan-400 group-hover:text-cyan-400 transition-colors">
            ${String.fromCharCode(65+i)}
          </span> 
          <span class="flex-1">${escapeHtml(displayText)}</span>
        `;
        // 重要: 使用閉包避免重複綁定
        btn.addEventListener('click', (function(optIdx) {
          return function() { selectOption(optIdx, btn); };
        })(i));
        optsContainer.appendChild(btn);
      }
      
      // 啟動計時器
      currentSession.timer = setInterval(() => {
        // 若題目已經被鎖定（已作答或已超時處理），則不再減少時間
        if (currentSession.isAnswerLocked) return;
        
        if (currentSession.timeLeft <= 1) {
          // 時間到，強制鎖定並推進
          if (currentSession.timer) clearInterval(currentSession.timer);
          currentSession.timer = null;
          if (!currentSession.isAnswerLocked) {
            currentSession.isAnswerLocked = true;
            // 沒有作答，記錄為 null (超時)
            if (currentSession.userAnswers[currentSession.currentIndex] === null) {
              currentSession.userAnswers[currentSession.currentIndex] = null;
            }
            // 直接處理下一題
            handleNext();
          }
        } else {
          currentSession.timeLeft--;
          const timerSpan = document.getElementById('timer-text');
          timerSpan.innerText = `${currentSession.timeLeft}s`;
          if (currentSession.timeLeft <= 5) {
            timerSpan.classList.remove('accent-text');
            timerSpan.classList.add('text-red-400');
          }
        }
      }, 1000);
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function selectOption(optIndex, btnElement) {
      // 如果已經鎖定或是已經有答案則拒絕
      if (currentSession.isAnswerLocked) return;
      const currentIdx = currentSession.currentIndex;
      if (currentSession.userAnswers[currentIdx] !== null) return;
      
      // 鎖定，避免重複點擊
      currentSession.isAnswerLocked = true;
      
      // 清除計時器
      if (currentSession.timer) {
        clearInterval(currentSession.timer);
        currentSession.timer = null;
      }
      
      const qData = currentSession.questions[currentIdx];
      const selectedOptionText = qData.options[optIndex];
      // 儲存使用者選擇的選項文字（便於後續比對）
      currentSession.userAnswers[currentIdx] = selectedOptionText;
      
      // 視覺反饋：清除所有選項的 selected 狀態，高亮當前選中
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(btn => btn.classList.remove('selected'));
      btnElement.classList.add('selected');
      
      // 延遲短暫時間進入下一題，讓用戶看到反饋
      setTimeout(() => {
        handleNext();
      }, 300);
    }
    
    function handleNext() {
      const nextIdx = currentSession.currentIndex + 1;
      if (nextIdx < currentSession.questions.length) {
        currentSession.currentIndex = nextIdx;
        // 重置鎖定狀態 (新題目剛開始未鎖定)
        currentSession.isAnswerLocked = false;
        loadQuestion(nextIdx);
      } else {
        finishQuiz();
      }
    }
    
    function finishQuiz() {
      if (currentSession.timer) {
        clearInterval(currentSession.timer);
        currentSession.timer = null;
      }
      
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('results-screen').classList.remove('hidden');
      
      const listContainer = document.getElementById('feedback-list');
      listContainer.innerHTML = '';
      
      let correctCount = 0;
      
      currentSession.questions.forEach((q, idx) => {
        const userChoiceText = currentSession.userAnswers[idx];
        let isCorrect = false;
        let displayUserChoice = "Time Out / No Answer";
        
        if (userChoiceText !== null && userChoiceText !== undefined) {
          displayUserChoice = userChoiceText;
          // 比對選項文字與正確答案
          if (userChoiceText === q.correctAnswer) {
            isCorrect = true;
          }
        }
        
        if (isCorrect) {
          correctCount++;
          if (wrongHistory.has(q.originalIndex)) wrongHistory.delete(q.originalIndex);
        } else {
          wrongHistory.add(q.originalIndex);
        }
        
        let sentenceWithAnswer = q.text;
        if (sentenceWithAnswer.includes('___') || sentenceWithAnswer.includes('____')) {
          sentenceWithAnswer = sentenceWithAnswer.replace(/_{2,}/g, `<span class="text-emerald-300 font-bold border-b-2 border-emerald-300/50 px-1">${escapeHtml(q.correctAnswer)}</span>`);
        } else {
          sentenceWithAnswer = `${sentenceWithAnswer} <span class="text-cyan-300 text-sm ml-2">(正確: ${escapeHtml(q.correctAnswer)})</span>`;
        }
        
        const plainTextForTTS = q.text.replace(/_{2,}/g, q.correctAnswer);
        
        const cardDiv = document.createElement('div');
        cardDiv.className = `p-5 rounded-2xl border backdrop-blur-sm transition-all ${isCorrect ? 'border-emerald-400/30 bg-emerald-900/20' : 'border-rose-400/30 bg-rose-900/20'}`;
        cardDiv.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="text-xs font-mono text-blue-200/60 bg-blue-950/50 px-2 py-1 rounded">${escapeHtml(q.code)}</span>
            <span class="text-xs font-extrabold px-3 py-1 rounded-full tracking-wider ${isCorrect ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}">
              ${isCorrect ? '<i class="fas fa-check mr-1"></i> CORRECT' : '<i class="fas fa-times mr-1"></i> WRONG'}
            </span>
          </div>
          <p class="text-lg mb-3 leading-relaxed text-white/90 font-medium">${sentenceWithAnswer}</p>
          ${!isCorrect ? `<div class="text-sm text-rose-300 mb-2 bg-rose-950/30 p-2 rounded-lg"><i class="fas fa-arrow-right mr-2"></i>Your choice: <span class="font-bold">${escapeHtml(displayUserChoice)}</span></div>` : ''}
          <button onclick="window.speakTextFn(this, '${escapeHtml(plainTextForTTS).replace(/'/g, "\\'")}')" class="text-sm px-4 py-2 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 text-blue-300 transition-colors flex items-center gap-2 border border-blue-400/20">
            <i class="fas fa-volume-high"></i> Play Audio
          </button>
        `;
        listContainer.appendChild(cardDiv);
      });
      
      const finalScorePercent = Math.round((correctCount / QUESTION_LIMIT) * 100);
      const resultMsg = {
        type: "LUNAR_MISSION_RESULT",
        correct: correctCount,
        mission: "GSAT 真題"
      };
      if (window.opener) {
        window.opener.postMessage(resultMsg, "*");
      }
      localStorage.setItem("lunar_pending_result", JSON.stringify(resultMsg));
      
      animateValue(document.getElementById('score-display'), 0, finalScorePercent, 1200);
    }
    
    function animateValue(obj, start, end, duration) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerText = Math.floor(progress * (end - start) + start);
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    
    // 全局語音函數
    window.speakTextFn = function(btn, text) {
      if (!text) return;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = `<i class="fas fa-wave-square animate-pulse text-cyan-400"></i> Speaking...`;
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.onend = () => { btn.innerHTML = originalHtml; };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      } else {
        alert("不支援語音");
        btn.innerHTML = originalHtml;
      }
    };
    
    function exitApp() { location.reload(); }
    
    // 事件綁定 (確保按鈕監聽)
    document.addEventListener('DOMContentLoaded', () => {
      initParticles();
      loadData();
      
      // 動態綁定按鈕，避免 onclick 內嵌遺失
      const startBtn = document.getElementById('start-quiz-btn');
      if (startBtn) startBtn.onclick = () => startQuiz(false);
      const nextChallengeBtn = document.getElementById('next-challenge-btn');
      if (nextChallengeBtn) nextChallengeBtn.onclick = () => startQuiz(true);
      const printBtn = document.getElementById('print-results-btn');
      if (printBtn) printBtn.onclick = () => window.print();
      const exitBtn = document.getElementById('exit-app-btn');
      if (exitBtn) exitBtn.onclick = () => exitApp();
    });
  </script>
</body>
