<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Shirley's Bilingual Humanities | 人文雙語學堂</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f7f3eb;
            background-image: radial-gradient(circle at 10% 20%, rgba(200, 180, 150, 0.08) 0%, rgba(160, 130, 100, 0.03) 100%);
            color: #3a2c1f;
            overflow-x: hidden;
            min-height: 100vh;
        }
        #humanitiesCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0.3; }
        .container { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 1.8rem 2rem 3rem; }
        .hero { text-align: center; margin-bottom: 2rem; }
        .hero h1 { font-size: 3rem; font-weight: 500; font-family: 'Cormorant Garamond', serif; color: #6b4c3a; }
        .hero h1 i { color: #b87c5a; font-size: 2.5rem; margin: 0 0.5rem; }
        .hero p { font-size: 0.95rem; color: #8b6b55; margin-top: 0.5rem; font-style: italic; }
        .hero .stats { margin-top: 0.5rem; font-size: 0.8rem; color: #b89a7a; }
        .search-global { max-width: 550px; margin: 0 auto 2rem auto; display: flex; gap: 10px; background: #fffef8; border-radius: 50px; padding: 0.2rem 0.2rem 0.2rem 1.5rem; border: 1px solid #d4c4b0; }
        .search-global input { flex: 1; background: transparent; border: none; padding: 0.8rem 0; font-size: 0.9rem; color: #3a2c1f; outline: none; }
        .search-global button { background: #d4b898; border: none; border-radius: 50px; padding: 0 1.5rem; color: #3a2c1f; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .search-global button:hover { background: #c4a47a; transform: scale(0.96); }
        .strands-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; }
        .strand-btn { background: #fffef5; border: 1px solid #d9caba; padding: 0.6rem 1.5rem; border-radius: 40px; font-weight: 500; font-size: 0.85rem; cursor: pointer; color: #6b4c3a; display: flex; align-items: center; gap: 8px; }
        .strand-btn.active { background: #d4b898; color: #2c1f12; border-color: #c4a47a; }
        .content-panel { background: rgba(255, 252, 245, 0.88); backdrop-filter: blur(8px); border-radius: 1.8rem; padding: 1.6rem; border: 1px solid #e8dfd0; }
        .starred-section { margin-bottom: 1.8rem; }
        .starred-header { display: flex; justify-content: space-between; border-bottom: 1px solid #e2d5c4; padding-bottom: 0.5rem; margin-bottom: 0.8rem; }
        .starred-header h3 { color: #6b4c3a; font-weight: 500; }
        .star-badge { background: #efe3d4; padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.7rem; color: #8b6b55; }
        .starred-list { display: flex; flex-wrap: wrap; gap: 8px; background: #faf6ef; border-radius: 1rem; padding: 0.6rem; min-height: 55px; }
        .starred-word { background: #e8dccc; padding: 4px 12px; border-radius: 24px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: #5a3e2e; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.2rem; }
        .mode-toggle { display: flex; gap: 10px; }
        .mode-btn { background: #f4ede4; border: 1px solid #d9caba; padding: 6px 18px; border-radius: 40px; cursor: pointer; font-size: 0.8rem; color: #6b4c3a; }
        .mode-btn.active { background: #d4b898; color: #2c1f12; }
        .reset-btn { background: none; border: 1px solid #d9caba; padding: 6px 18px; border-radius: 40px; cursor: pointer; font-size: 0.8rem; color: #6b4c3a; }
        .terms-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.2rem; margin-top: 1rem; }
        .term-card { background: #fffefa; border-radius: 1.2rem; padding: 1.2rem; border-left: 4px solid #d4b898; border: 1px solid #ede3d5; transition: all 0.25s ease; }
        .term-card:hover { transform: translateY(-3px); border-left-color: #b87c5a; }
        .interactive-viz { margin-top: 12px; background: #faf3e8; border-radius: 16px; padding: 8px; border: 1px solid #e2d2c0; min-height: 120px; text-align: center; }
        .viz-canvas { width: 100%; height: 100px; border-radius: 12px; background: #fdf8f0; }
        .flashcard-container { perspective: 1500px; height: 340px; margin-top: 1rem; }
        .flashcard { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 1.5rem; padding: 2rem; display: flex; flex-direction: column; justify-content: center; background: #fffefa; border: 1px solid #d9caba; }
        .card-front { transform: rotateY(0deg); }
        .card-back { transform: rotateY(180deg); background: #fef7ef; }
        .flashcard-word { font-size: 1.6rem; font-weight: 500; margin-bottom: 1rem; color: #6b4c3a; font-family: 'Cormorant Garamond', serif; }
        .flashcard-sentence { font-size: 0.85rem; margin-top: 1rem; color: #8b6b55; }
        .flash-nav { display: flex; justify-content: center; gap: 1rem; margin-top: 1.2rem; }
        .flash-nav button { background: #d4b898; border: none; padding: 8px 20px; border-radius: 40px; color: #2c1f12; font-weight: 500; cursor: pointer; }
        .term-word { font-size: 1.2rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: #5a3e2e; }
        .star-icon { color: #d4a373; cursor: pointer; font-size: 1rem; }
        .star-icon.far { color: #d9caba; }
        .term-meaning { font-size: 0.95rem; color: #8b6b55; margin: 6px 0; }
        .sentence { font-size: 0.75rem; background: #faf3e8; padding: 8px; border-radius: 12px; margin: 8px 0; color: #7a5a44; }
        .btn-speak { background: none; border: none; color: #b87c5a; cursor: pointer; font-size: 0.8rem; }
        .no-results { text-align: center; padding: 2rem; font-size: 0.9rem; color: #b8a48c; }
        footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #c4b5a0; }
        .loading, .error-message { text-align: center; padding: 2rem; color: #a68b70; }
        .error-message { color: #c97e5a; }
        @media (max-width: 650px) { .container { padding: 1rem; } }
    </style>
</head>
<body>
<canvas id="humanitiesCanvas"></canvas>
<div class="container">
    <div class="hero">
        <h1><i class="fas fa-feather-alt"></i> Shirley's Bilingual Humanities <i class="fas fa-book-open"></i></h1>
        <p>人文思想 · 雙語交匯 | 歷史 · 哲學 · 政治 · 法律 · 倫理 · 教育</p>
        <div class="stats" id="dataStats">📚 等待載入人文詞彙...</div>
    </div>
    <div class="search-global">
        <i class="fas fa-search"></i>
        <input type="text" id="globalSearchInput" placeholder="搜尋詞彙 / 中文 (如: democracy, 正義)" autocomplete="off">
        <button id="globalSearchBtn">尋思</button>
    </div>
    <div class="strands-grid" id="strandsContainer"><div class="loading">📖 正在載入人文詞彙...</div></div>
    <div class="content-panel">
        <div class="starred-section">
            <div class="starred-header"><h3><i class="fas fa-star" style="color: #d4a373;"></i> 我的珍藏</h3><div class="star-badge">點擊星星收藏</div></div>
            <div id="starredWordsContainer" class="starred-list"></div>
        </div>
        <div class="controls-bar">
            <div class="mode-toggle"><button class="mode-btn active" data-mode="grid">卡片瀏覽</button><button class="mode-btn" data-mode="flashcard">閃卡溫習</button></div>
            <button id="resetSearchBtn" class="reset-btn"><i class="fas fa-undo-alt"></i> 重置</button>
        </div>
        <div id="currentStrandTitle" style="margin-bottom: 1rem; font-size: 0.9rem; color: #b87c5a;"><i class="fas fa-scroll"></i> </div>
        <div id="dynamicContentArea"></div>
    </div>
    <footer>🎧 點擊喇叭聆聽發音 | 閃卡模式點擊翻轉 | 請將此檔案與 humanities.csv 放在同一資料夾</footer>
</div>

<script>
    let humanitiesData = [];
    let currentStrand = "";
    let starredWords = JSON.parse(localStorage.getItem("humanities_starred_v2") || "[]");
    let searchKeyword = "";
    let currentMode = "grid";
    let flashcardIndex = 0;
    let filteredTermsCache = [];

    // 直接讀取同一個資料夾下的 CSV 檔案 (解決 CORS 問題)
    const CSV_PATH = "./humanities.csv";

    // 人文視覺化效果
    function initHumanitiesBackground() {
        const canvas = document.getElementById("humanitiesCanvas");
        const ctx = canvas.getContext("2d");
        let width, height, elements = [];
        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener("resize", resize);
        resize();
        const icons = ["📖", "🪶", "✒️", "📜", "🏛️", "⚖️", "💭"];
        for(let i=0;i<40;i++) {
            elements.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 18 + 12, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.1, char: icons[Math.floor(Math.random() * icons.length)], alpha: Math.random() * 0.15 + 0.05 });
        }
        function draw() {
            ctx.clearRect(0, 0, width, height);
            elements.forEach(e => { ctx.font = `${e.size}px "Segoe UI Emoji"`; ctx.fillStyle = `rgba(180, 140, 100, ${e.alpha})`; ctx.fillText(e.char, e.x, e.y); e.x += e.vx; e.y += e.vy; if(e.x < -30) e.x = width + 20; if(e.x > width + 30) e.x = -20; if(e.y < -30) e.y = height + 20; if(e.y > height + 30) e.y = -20; });
            requestAnimationFrame(draw);
        }
        draw();
    }

    // 人文視覺化
    function createHumanitiesViz(word, containerId) {
        const canvasId = `viz_${Date.now()}_${Math.random()}`;
        setTimeout(() => {
            const container = document.getElementById(containerId);
            if (!container) return;
            let canvas = document.createElement('canvas');
            canvas.id = canvasId; canvas.width = container.clientWidth - 16; canvas.height = 100;
            canvas.style.width = '100%'; canvas.style.height = '100px'; canvas.style.borderRadius = '12px';
            canvas.style.backgroundColor = '#fdf8f0'; canvas.className = 'viz-canvas';
            container.innerHTML = ''; container.appendChild(canvas);
            function drawIcon(emoji, label) {
                function animate() {
                    const c = document.getElementById(canvasId);
                    if (!c) return;
                    const ctx = c.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fdf8f0'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = `${Math.min(40, canvas.height/2)}px "Segoe UI Emoji"`;
                    ctx.fillStyle = '#d4a373'; ctx.fillText(emoji, canvas.width/2-20, canvas.height/2+15);
                    ctx.fillStyle = '#8b6b55'; ctx.font = '10px "Cormorant Garamond"';
                    ctx.fillText(label, canvas.width/2-25, canvas.height-8);
                    requestAnimationFrame(animate);
                }
                animate();
            }
            const w = word.toLowerCase();
            if (w.includes('democracy') || w.includes('vote') || w.includes('election')) drawIcon("🗳️", "公民投票");
            else if (w.includes('justice') || w.includes('law') || w.includes('right')) drawIcon("⚖️", "正義天秤");
            else if (w.includes('philosophy') || w.includes('truth') || w.includes('reason')) drawIcon("💭", "我思故我在");
            else drawIcon("📖", "知識之書");
        }, 100);
    }

    // 解析 CSV
    async function loadCSV() {
        try {
            console.log("嘗試讀取:", CSV_PATH);
            const response = await fetch(CSV_PATH);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const csvText = await response.text();
            parseCSV(csvText);
        } catch (error) {
            console.error("載入失敗:", error);
            document.getElementById("strandsContainer").innerHTML = `<div class="error-message">
                <i class="fas fa-exclamation-triangle"></i> 無法讀取 humanities.csv<br><br>
                請確認：<br>
                1. 已將此 HTML 檔案與 humanities.csv 放在「同一個資料夾」中<br>
                2. 檔案名稱正確 (humanities.csv)<br>
                3. 直接使用瀏覽器開啟此 HTML 檔案 (而非透過網頁伺服器)<br><br>
                <button onclick="location.reload()" style="background:#d4b898; border:none; padding:8px 20px; border-radius:40px; cursor:pointer;">重新載入</button>
            </div>`;
        }
    }

    function parseCSV(csv) {
        const lines = csv.split(/\r?\n/);
        if (lines.length < 2) return;
        const headers = lines[0].split(',');
        const subjectIdx = headers.indexOf('subject');
        const wordIdx = headers.indexOf('word');
        const posIdx = headers.indexOf('pos');
        const meaningIdx = headers.indexOf('meaning');
        const sentenceEIdx = headers.indexOf('sentence e');
        const sentenceCIdx = headers.indexOf('sentence c');
        
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            let row = [], inQuote = false, current = '';
            for (let ch of line) {
                if (ch === '"') inQuote = !inQuote;
                else if (ch === ',' && !inQuote) { row.push(current.trim()); current = ''; }
                else current += ch;
            }
            row.push(current.trim());
            if (row.length < 6) continue;
            const term = {
                subject: row[subjectIdx] || "", word: row[wordIdx] || "", pos: row[posIdx] || "",
                meaning: row[meaningIdx] || "", sentence_e: row[sentenceEIdx] || "", sentence_c: row[sentenceCIdx] || ""
            };
            if (term.word && term.subject) humanitiesData.push(term);
        }
        
        if (humanitiesData.length > 0) {
            document.getElementById("dataStats").innerHTML = `📚 已載入 ${humanitiesData.length} 個人文詞彙`;
            const subjects = [...new Set(humanitiesData.map(d => d.subject))];
            currentStrand = subjects[0];
            initHumanitiesBackground();
            renderAll();
        } else {
            document.getElementById("strandsContainer").innerHTML = '<div class="error-message">CSV 檔案中沒有找到有效的詞彙資料</div>';
        }
    }

    // 核心功能
    function saveStarred() { localStorage.setItem("humanities_starred_v2", JSON.stringify(starredWords)); }
    function toggleStar(term) {
        const exists = starredWords.some(s => s.word === term.word && s.subject === term.subject);
        if (exists) starredWords = starredWords.filter(s => !(s.word === term.word && s.subject === term.subject));
        else starredWords.push({ word: term.word, meaning: term.meaning, subject: term.subject });
        saveStarred(); renderAll();
    }
    function speakText(text) { const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
    function getFilteredTerms() {
        let terms = humanitiesData.filter(t => t.subject === currentStrand);
        if (searchKeyword.trim()) { const kw = searchKeyword.trim().toLowerCase(); terms = terms.filter(t => t.word.toLowerCase().includes(kw) || t.meaning.includes(kw) || t.sentence_c.includes(kw)); }
        return terms;
    }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    
    function renderGridMode(terms) {
        if (terms.length === 0) return `<div class="no-results">📭 在此領域中未找到相關詞彙</div>`;
        return `<div class="terms-container">${terms.map((term, idx) => {
            const isStarred = starredWords.some(s => s.word === term.word && s.subject === term.subject);
            const vizId = `viz_${idx}_${Date.now()}`;
            setTimeout(() => createHumanitiesViz(term.word, vizId), 50);
            return `<div class="term-card"><div class="term-word"><span><strong>${escapeHtml(term.word)}</strong> <span style="font-size:0.65rem;">${escapeHtml(term.pos)}</span></span>
            <i class="star-icon ${isStarred ? 'fas fa-star' : 'far fa-star'}" data-word="${escapeHtml(term.word)}" data-sub="${escapeHtml(term.subject)}"></i></div>
            <div class="term-meaning">${escapeHtml(term.meaning)}</div><div class="sentence">${escapeHtml(term.sentence_e)}<br>${escapeHtml(term.sentence_c)}</div>
            <button class="btn-speak" data-text="${escapeHtml(term.word)}"><i class="fas fa-volume-up"></i> 聆聽</button>
            <div class="interactive-viz" id="${vizId}"><div class="viz-label">📜 人文意象載入中...</div></div></div>`;}).join('')}</div>`;
    }
    
    function renderFlashcardMode(terms) {
        if (terms.length === 0) return `<div class="no-results">暫無詞彙</div>`;
        if (flashcardIndex >= terms.length) flashcardIndex = 0;
        const term = terms[flashcardIndex];
        return `<div class="flashcard-container"><div class="flashcard" id="activeFlashcard"><div class="card-front"><div class="flashcard-word">${escapeHtml(term.word)}</div><div class="flashcard-sentence">${escapeHtml(term.sentence_e)}</div><div class="flashcard-label" style="font-size:0.7rem; margin-top:1rem;">🖱️ 點擊翻轉</div></div>
        <div class="card-back"><div class="flashcard-word">${escapeHtml(term.meaning)}</div><div class="flashcard-sentence">${escapeHtml(term.sentence_c)}</div><div class="flashcard-label" style="font-size:0.7rem; margin-top:1rem;">📖 中文釋義</div></div></div></div>
        <div class="flash-nav"><button id="prevCardBtn">◀ 上一張</button><span style="color:#8b6b55;">${flashcardIndex+1} / ${terms.length}</span><button id="nextCardBtn">下一張 ▶</button><button id="speakCardBtn"><i class="fas fa-volume-up"></i> 發音</button></div>`;
    }
    
    function renderDynamicContent() {
        const filtered = getFilteredTerms();
        filteredTermsCache = filtered;
        const area = document.getElementById("dynamicContentArea");
        if (currentMode === "grid") { area.innerHTML = renderGridMode(filtered); attachGridEvents(); }
        else { area.innerHTML = renderFlashcardMode(filtered); attachFlashcardEvents(); }
    }
    
    function attachGridEvents() {
        document.querySelectorAll('.star-icon').forEach(icon => {
            icon.addEventListener('click', (e) => { e.stopPropagation();
                const wordName = icon.getAttribute('data-word'), subj = icon.getAttribute('data-sub');
                const target = humanitiesData.find(t => t.word === wordName && t.subject === subj);
                if (target) toggleStar(target);
            });
        });
        document.querySelectorAll('.btn-speak').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); const text = btn.getAttribute('data-text'); if(text) speakText(text); });
        });
    }
    
    function attachFlashcardEvents() {
        const flashcard = document.getElementById("activeFlashcard");
        if (flashcard) flashcard.addEventListener("click", () => flashcard.classList.toggle("flipped"));
        document.getElementById("prevCardBtn")?.addEventListener("click", () => { if (filteredTermsCache.length) { flashcardIndex = (flashcardIndex - 1 + filteredTermsCache.length) % filteredTermsCache.length; renderDynamicContent(); } });
        document.getElementById("nextCardBtn")?.addEventListener("click", () => { if (filteredTermsCache.length) { flashcardIndex = (flashcardIndex + 1) % filteredTermsCache.length; renderDynamicContent(); } });
        document.getElementById("speakCardBtn")?.addEventListener("click", () => { if (filteredTermsCache[flashcardIndex]) speakText(filteredTermsCache[flashcardIndex].word); });
    }
    
    function renderStarredList() {
        const container = document.getElementById("starredWordsContainer");
        if (starredWords.length === 0) { container.innerHTML = '<div class="empty-star">⭐ 暫無收藏，點擊星星收藏</div>'; return; }
        container.innerHTML = starredWords.map(s => `<div class="starred-word" data-word="${escapeHtml(s.word)}">${escapeHtml(s.word)} <i class="fas fa-times-circle" data-remove="${escapeHtml(s.word)}"></i></div>`).join('');
        document.querySelectorAll('.starred-word i').forEach(icon => { icon.addEventListener('click', (e) => { e.stopPropagation(); const w = icon.getAttribute('data-remove'); starredWords = starredWords.filter(s => s.word !== w); saveStarred(); renderAll(); }); });
        document.querySelectorAll('.starred-word').forEach(el => { el.addEventListener('click', (e) => { if(e.target.tagName === 'I') return; const word = el.getAttribute('data-word'); const found = humanitiesData.find(t => t.word === word); if(found) { currentStrand = found.subject; searchKeyword = ""; document.getElementById("globalSearchInput").value = ""; renderAll(); } }); });
    }
    
    function renderStrands() {
        const subjects = [...new Set(humanitiesData.map(d => d.subject))];
        const container = document.getElementById("strandsContainer");
        if (subjects.length === 0) return;
        container.innerHTML = subjects.map(sub => `<button class="strand-btn ${currentStrand === sub ? 'active' : ''}" data-subject="${escapeHtml(sub)}"><i class="fas fa-scroll"></i> ${escapeHtml(sub)}</button>`).join('');
        document.querySelectorAll('.strand-btn').forEach(btn => { btn.addEventListener('click', () => { currentStrand = btn.getAttribute('data-subject'); searchKeyword = ""; flashcardIndex = 0; document.getElementById("globalSearchInput").value = ""; renderAll(); }); });
    }
    
    function renderAll() {
        if (humanitiesData.length === 0) return;
        renderStrands(); renderStarredList(); renderDynamicContent();
        document.getElementById("currentStrandTitle").innerHTML = `<i class="fas fa-feather-alt"></i> 當前領域：${currentStrand}`;
    }
    
    // 事件綁定
    document.addEventListener("click", (e) => {
        if (e.target.closest(".mode-btn")) {
            const btn = e.target.closest(".mode-btn");
            const mode = btn.getAttribute("data-mode");
            if (mode) { currentMode = mode; document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active")); btn.classList.add("active"); flashcardIndex = 0; renderDynamicContent(); }
        }
    });
    document.getElementById("globalSearchBtn").addEventListener("click", () => { searchKeyword = document.getElementById("globalSearchInput").value; flashcardIndex = 0; renderDynamicContent(); });
    document.getElementById("globalSearchInput").addEventListener("keyup", (e) => { if(e.key === "Enter") { searchKeyword = document.getElementById("globalSearchInput").value; flashcardIndex = 0; renderDynamicContent(); } });
    document.getElementById("resetSearchBtn").addEventListener("click", () => { searchKeyword = ""; flashcardIndex = 0; document.getElementById("globalSearchInput").value = ""; renderDynamicContent(); });
    
    loadCSV();
</script>
</body>
</html>
