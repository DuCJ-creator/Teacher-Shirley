
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國中教材對照版 v3｜生物分類圓形遞進學習平台</title>
  <style>
    :root{
      --bg1:#dfe8de;
      --bg2:#d8d5cb;
      --panel:#fff9ef;
      --green:#96c094;
      --green-dark:#31513a;
      --gold:#d3b477;
      --gold-soft:#efe1b0;
      --ink:#1f2920;
      --muted:#5b665b;
      --shadow:0 18px 40px rgba(0,0,0,.13);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      color:var(--ink);
    }
    .page{
      max-width:1540px;
      margin:24px auto;
      padding:0 16px 32px;
    }
    .shell{
      background:rgba(255,250,240,.94);
      border:1px solid rgba(255,255,255,.8);
      box-shadow:var(--shadow);
      border-radius:38px;
      padding:26px 22px 32px;
    }
    .hero{
      text-align:center;
      margin-bottom:18px;
    }
    .hero h1{
      margin:0;
      color:#24462f;
      font-size:2rem;
      font-weight:900;
    }
    .hero p{
      margin:10px 0 0;
      color:#566759;
      line-height:1.8;
    }
    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:center;
      background:#e6eee1;
      border-radius:999px;
      padding:12px;
      margin-bottom:18px;
    }
    .topbar input,.topbar select,.topbar button{
      font-family:inherit;
      font-size:.97rem;
      padding:12px 16px;
      border:none;
      border-radius:999px;
    }
    .topbar input{
      min-width:320px;
      flex:1 1 360px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .topbar select{background:#fff; min-width:150px}
    .topbar button{
      cursor:pointer;
      font-weight:800;
      transition:.18s ease;
    }
    .topbar button:hover,.action-btn:hover,.crumb:hover,.circle-card:hover,.mini-jump:hover{transform:translateY(-2px)}
    .primary{background:#456f4d;color:#fff}
    .secondary{background:#bda170;color:#2d2315}
    .layout{
      display:grid;
      grid-template-columns:360px 1fr;
      gap:18px;
      align-items:start;
    }
    .panel{
      background:rgba(255,255,255,.58);
      border:1px solid #eadfc8;
      border-radius:30px;
      padding:18px;
    }
    .panel h2{
      margin:0 0 12px;
      color:#294433;
      font-size:1.1rem;
    }
    .current-node{
      position:sticky;
      top:14px;
      background:linear-gradient(180deg,#fff7e7,#fffdf8);
    }
    .node-title{
      font-size:1.4rem;
      font-weight:900;
      color:#264332;
      line-height:1.45;
    }
    .node-sub{
      margin-top:10px;
      color:#5a695d;
      line-height:1.8;
      font-size:.96rem;
    }
    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }
    .pill{
      background:#edf3e6;
      color:#294332;
      padding:7px 12px;
      border-radius:999px;
      font-size:.88rem;
      font-weight:700;
    }
    .quick-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }
    .action-btn{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-family:inherit;
      font-weight:800;
      cursor:pointer;
      transition:.18s ease;
      background:#497251;
      color:#fff;
    }
    .action-btn.alt{background:#c0a46d;color:#302414}
    .note-box{
      margin-top:14px;
      background:#fff6df;
      border:1px solid #ead6a7;
      border-radius:18px;
      padding:12px;
      color:#675a3c;
      line-height:1.75;
      font-size:.9rem;
    }
    .breadcrumb{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
      align-items:center;
    }
    .crumb{
      background:#2f4d38;
      color:#fff4d8;
      padding:8px 12px;
      border-radius:999px;
      font-size:.9rem;
      cursor:pointer;
      transition:.18s ease;
    }
    .crumb.alt{
      background:#c2a56f;
      color:#2f2414;
    }
    .gallery-wrap{
      background:linear-gradient(180deg,#fbf4e5,#fffaf1);
      border:1px solid #e7d8be;
      border-radius:34px;
      padding:18px 18px 24px;
      min-height:590px;
    }
    .gallery-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .gallery-title{
      font-size:1.08rem;
      font-weight:900;
      color:#35523e;
    }
    .gallery-tip{
      font-size:.9rem;
      color:#627162;
    }
    .gallery-stage{
      position:relative;
      min-height:470px;
      overflow:hidden;
      border-radius:24px;
    }
    .gallery-view{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(3,minmax(180px,1fr));
      gap:26px 22px;
      justify-items:center;
      align-content:start;
      padding:6px 4px 12px;
    }
    .enter-right{animation:slideInRight .32s ease both}
    .enter-left{animation:slideInLeft .32s ease both}
    .search-fade{animation:fadeIn .24s ease both}
    @keyframes slideInRight{from{opacity:.2;transform:translateX(70px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slideInLeft{from{opacity:.2;transform:translateX(-70px)}to{opacity:1;transform:translateX(0)}}
    @keyframes fadeIn{from{opacity:.2;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
    .circle-card{
      width:100%;
      max-width:240px;
      display:flex;
      flex-direction:column;
      align-items:center;
      cursor:pointer;
      transition:.18s ease;
    }
    .circle-shell{
      width:210px;
      height:210px;
      border-radius:50%;
      background:linear-gradient(180deg,#95bf94,#8db38d);
      padding:8px;
      box-shadow:0 12px 26px rgba(0,0,0,.14);
    }
    .circle-ring{
      width:100%;
      height:100%;
      border-radius:50%;
      background:#d9c28d;
      padding:8px;
    }
    .circle-core{
      width:100%;
      height:100%;
      border-radius:50%;
      background:radial-gradient(circle at 30% 25%, #f7f0dc, #eee1c0 72%);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:18px 14px;
    }
    .circle-en,.circle-zh{
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      border-radius:999px;
      padding:8px 14px;
      font-weight:900;
    }
    .circle-en{
      background:#bfd1aa;
      font-size:1.02rem;
      margin-bottom:10px;
    }
    .circle-zh{
      background:#efe1ae;
      font-size:1.01rem;
      margin-bottom:10px;
    }
    .circle-rank{
      font-size:.96rem;
      font-weight:700;
      color:#2c2616;
      margin-top:4px;
    }
    .circle-hint{
      margin-top:10px;
      font-size:.96rem;
      font-weight:900;
    }
    .circle-note{
      margin-top:6px;
      min-height:38px;
      text-align:center;
      color:#5c665a;
      font-size:.82rem;
      line-height:1.45;
    }
    .detail{
      margin-top:18px;
      background:#fff4dc;
      border:1px solid #ead3a3;
      border-radius:28px;
      padding:20px;
      animation:fadeIn .22s ease both;
    }
    .detail h3{
      margin:0 0 10px;
      color:#2c4934;
      font-size:1.28rem;
    }
    .detail p{
      margin:0 0 12px;
      color:#58695d;
      line-height:1.8;
    }
    .detail-chip-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:10px 0 16px;
    }
    .detail-chip{
      background:#eef3e5;
      color:#2a4332;
      border-radius:999px;
      padding:7px 12px;
      font-size:.9rem;
      font-weight:700;
    }
    .sub-title{
      margin:6px 0 12px;
      color:#34513c;
      font-weight:900;
    }
    .subgrid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
      gap:14px;
    }
    .mini-jump{text-align:center;cursor:pointer}
    .mini-circle{
      width:102px;
      height:102px;
      margin:0 auto;
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #f8ecd2, #ead4a5);
      box-shadow:0 8px 14px rgba(0,0,0,.08);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:10px;
    }
    .mini-circle .en{font-size:.78rem;font-weight:800}
    .mini-circle .zh{font-size:.82rem;font-weight:900;margin-top:5px}
    .mini-label{margin-top:8px;color:#59695b;font-size:.76rem;font-weight:800}
    .empty{
      grid-column:1/-1;
      text-align:center;
      padding:56px 16px;
      color:#617161;
      font-size:1rem;
    }

    .group-header{
      grid-column:1/-1;
      background:linear-gradient(90deg,#eef4e8,#fff6df);
      border:1px solid #e4d6b8;
      border-radius:20px;
      padding:12px 16px;
      margin-top:4px;
    }
    .group-title{
      font-size:1rem;
      font-weight:900;
      color:#31503a;
    }
    .group-sub{
      margin-top:4px;
      color:#6a715f;
      font-size:.86rem;
      line-height:1.6;
    }
    .teach-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(220px,1fr));
      gap:12px;
      margin:14px 0 16px;
    }
    .teach-card{
      background:#fffaf0;
      border:1px solid #eadcbd;
      border-radius:20px;
      padding:14px;
    }
    .teach-card h4{
      margin:0 0 8px;
      font-size:.95rem;
      color:#2e4b38;
    }
    .teach-card p{
      margin:0;
      color:#5d6b5f;
      line-height:1.75;
      font-size:.92rem;
    }
    .mode-line{
      margin-top:12px;
      color:#6a715f;
      font-size:.9rem;
      line-height:1.7;
    }

    @media (max-width:1080px){
      .layout{grid-template-columns:1fr}
      .current-node{position:static}
      .gallery-view{grid-template-columns:repeat(2,minmax(180px,1fr))}
      .teach-grid{grid-template-columns:1fr}
    }
    @media (max-width:690px){
      .page{padding:0 10px 24px}
      .shell{padding:20px 12px 24px}
      .hero h1{font-size:1.7rem}
      .topbar input{min-width:100%}
      .gallery-view{grid-template-columns:1fr}
      .circle-shell{width:190px;height:190px}
      .gallery-stage{min-height:720px}
    }
  </style>
</head>
<body>
<div class="page">
  <div class="shell">
    <div class="hero">
      <h1>Shirley's Bilingual Biology Taxonomy (Junior High)</h1>
      <p> <strong> 國中生物分類雙語互動平台</strong> </p>
      
      <p> <strong>域Domain → 界Kingdom → 門Phylum → 綱Class → 目Order → 科Family → 屬Genus → 種Species (King Phillip Came Over For Good Soup.)</strong> </p>
    </div>

    <div class="topbar">
      <input id="searchInput" type="text" placeholder="搜尋中文、英文、學名，例如 真菌界、哺乳綱、Homo sapiens、稻屬">
      <select id="rankFilter">
        <option value="all">全部層級</option>
        <option value="Domain">Domain</option>
        <option value="Kingdom">Kingdom</option>
        <option value="Phylum">Phylum</option>
        <option value="Class">Class</option>
        <option value="Order">Order</option>
        <option value="Family">Family</option>
        <option value="Genus">Genus</option>
        <option value="Species">Species</option>
      </select>
      <button id="searchBtn" class="primary">搜尋</button>
      <select id="viewMode">
        <option value="textbook" selected>課本主幹模式</option>
        <option value="full">完整分類模式</option>
      </select>
      <button id="homeBtn" class="secondary">回到起點</button>
    </div>

    <div class="layout">
      <aside class="panel current-node">
        <h2>📍 目前節點</h2>
        <div id="currentNodeBox"></div>
        <div class="quick-actions">
          <button class="action-btn alt" id="upBtn">↩ 返回上一層</button>
          <button class="action-btn" id="randomBtn">🎲 隨機節點</button>
        </div>
      </aside>

      <main class="panel">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="gallery-wrap">
          <div class="gallery-head">
            <div class="gallery-title" id="galleryTitle"></div>
            <div class="gallery-tip">點圓形卡片後，會滑動進入下一層</div>
          </div>
          <div class="gallery-stage" id="galleryStage"></div>
        </div>
        <div id="detailBox" class="detail" style="display:none;"></div>
      </main>
    </div>
  </div>
</div>

<script>
const taxonomyData = {
  id:'life',
  name_en:'Life',
  name_zh:'生命起點',

    {
      id:'d-archaea', name_en:'Archaea', name_zh:'古菌域', rank:'Domain',

      children:[
        {
          id:'k-archaea', name_en:'Archaebacteria', name_zh:'古細菌界', rank:'Kingdom',

            {
              id:'p-methano', name_en:'Euryarchaeota', name_zh:'廣古菌門', rank:'Phylum',

              children:[
                {
                  id:'c-methano', name_en:'Methanobacteria', name_zh:'甲烷桿菌綱', rank:'Class',

                      children:[
                        {
                          id:'f-methano', name_en:'Methanobacteriaceae', name_zh:'甲烷桿菌科', rank:'Family',

                            {
                              id:'g-methano', name_en:'Methanobacterium', name_zh:'甲烷桿菌屬', rank:'Genus',

                                {id:'s-methano', name_en:'Methanobacterium formicicum', name_zh:'甲酸甲烷桿菌', rank:'Species', description:'教材中常作產甲烷古菌例子。', children:[]}

                        }

                    }
                  ]
                },
                {

                      children:[

                          id:'f-halo', name_en:'Halobacteriaceae', name_zh:'鹽桿菌科', rank:'Family',

                              children:[
                                {id:'s-halo', name_en:'Halobacterium salinarum', name_zh:'鹽沼鹽桿菌', rank:'Species', description:'常見於鹽田與高鹽湖。', children:[]}
                              ]
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    {
      id:'d-bacteria', name_en:'Bacteria', name_zh:'細菌域', rank:'Domain',
      description:'數量最多、分布最廣的原核生物群。',
      children:[
        {
          id:'k-bacteria', name_en:'Eubacteria', name_zh:'真細菌界', rank:'Kingdom',

                              children:[
                                {id:'s-ecoli', name_en:'Escherichia coli', name_zh:'大腸桿菌', rank:'Species', description:'最常見的模式細菌之一。', children:[]}
                              ]
                            },
                            {
                              id:'g-salmonella', name_en:'Salmonella', name_zh:'沙門氏菌屬', rank:'Genus',

                              children:[

                          ]

                      ]

                  ]
                }
              ]
            },
            {

              children:[
                {
                  id:'c-bacilli', name_en:'Bacilli', name_zh:'芽孢桿菌綱', rank:'Class',
                  description:'土壤與環境中常見。',
                  children:[
                    {
                      id:'o-bacillales', name_en:'Bacillales', name_zh:'芽孢桿菌目', rank:'Order',

                      children:[

                          id:'f-bacillaceae', name_en:'Bacillaceae', name_zh:'芽孢桿菌科', rank:'Family',

                          children:[

                              id:'g-bacillus', name_en:'Bacillus', name_zh:'芽孢桿菌屬', rank:'Genus',

                              children:[
                                {id:'s-bsub', name_en:'Bacillus subtilis', name_zh:'枯草桿菌', rank:'Species', description:'常用模式細菌。', children:[]}

                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    {
      id:'d-eukarya', name_en:'Eukarya', name_zh:'真核生物域', rank:'Domain',
      description:'具有細胞核與膜狀胞器，包含原生生物、真菌、植物與動物。',
      children:[
        {
          id:'k-protista', name_en:'Protista', name_zh:'原生生物界', rank:'Kingdom',
          description:'結構較簡單的真核生物，國中課本常介紹原生動物、藻類與原生菌類。',
          children:[
            {
              id:'p-ciliophora', name_en:'Ciliophora', name_zh:'纖毛蟲門', rank:'Phylum',
              description:'以纖毛運動的原生生物。',
              children:[
                {
                  id:'c-oligo', name_en:'Oligohymenophorea', name_zh:'寡膜綱', rank:'Class',
                  description:'草履蟲所在綱。',
                  children:[
                    {
                      id:'o-peniculida', name_en:'Peniculida', name_zh:'草履蟲目', rank:'Order',
                      description:'典型纖毛蟲所在目。',
                      children:[
                        {
                          id:'f-parameciidae', name_en:'Parameciidae', name_zh:'草履蟲科', rank:'Family',
                          description:'草履蟲常見科。',
                          children:[
                            {
                              id:'g-paramecium', name_en:'Paramecium', name_zh:'草履蟲屬', rank:'Genus',
                              description:'國中常見原生生物教材。',
                              children:[
                                {id:'s-paramecium', name_en:'Paramecium caudatum', name_zh:'草履蟲', rank:'Species', description:'以纖毛游動。', children:[]}

                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]

const idMap = new Map();
const parentMap = new Map();

function indexTree(node, parent=null){
  idMap.set(node.id, node);
  if(parent) parentMap.set(node.id, parent.id);
  (node.children || []).forEach(child => indexTree(child, node));
}
indexTree(taxonomyData);

function addChild(parentId, child){
  const parent = idMap.get(parentId);
  if(!parent){
    console.warn('Missing parent:', parentId);
    return;
  }
  if(!Array.isArray(parent.children)) parent.children = [];
  parent.children.push(child);
  indexTree(child, parent);
}

}

function rankLabel(rank){ return rank || '分類'; }
function pathToNode(node){
  const path = [];
  let cur = node;
  while(cur){
    path.unshift(cur);
    const pid = parentMap.get(cur.id);
    cur = pid ? idMap.get(pid) : null;
  }
  return path;
}
function pathIds(node){
  return pathToNode(node).map(item => item.id);
}
function allNodes(){
  return Array.from(idMap.values()).filter(n => n.rank !== 'Root');
}
function descendantSpecies(node, limit=4){
  const found = [];
  function walk(n){
    if(found.length >= limit) return;
    if(n.rank === 'Species'){
      found.push(n.name_zh);
      return;
    }
    (n.children || []).forEach(child => walk(child));
  }
  walk(node);
  return found;
}
function siblingNames(node, limit=3){
  const pid = parentMap.get(node.id);
  if(!pid) return [];
  const parent = idMap.get(pid);
  return (parent.children || []).filter(child => child.id !== node.id).slice(0, limit).map(child => child.name_zh);
}
function getTextbookLineage(node){
  const ids = pathIds(node);
  if(ids.includes('k-animalia')){
    if(ids.includes('p-chordata')){
      if(ids.includes('c-chondrichthyes') || ids.includes('c-actinopterygii')) return '動物界 → 脊椎動物 → 魚類';
      if(ids.includes('c-amphibia')) return '動物界 → 脊椎動物 → 兩生類';
      if(ids.includes('c-reptilia')) return '動物界 → 脊椎動物 → 爬蟲類';
      if(ids.includes('c-aves')) return '動物界 → 脊椎動物 → 鳥類';
      if(ids.includes('c-mammalia')) return '動物界 → 脊椎動物 → 哺乳類';
      return '動物界 → 脊椎動物';
    }
    if(ids.includes('p-porifera')) return '動物界 → 無脊椎動物 → 海綿動物';
    if(ids.includes('p-cnidaria')) return '動物界 → 無脊椎動物 → 刺絲胞動物';
    if(ids.includes('p-platyhelminthes')) return '動物界 → 無脊椎動物 → 扁形動物';
    if(ids.includes('p-nematoda')) return '動物界 → 無脊椎動物 → 線形動物';
    if(ids.includes('p-annelida')) return '動物界 → 無脊椎動物 → 環節動物';
    if(ids.includes('p-mollusca')) return '動物界 → 無脊椎動物 → 軟體動物';
    if(ids.includes('p-arthropoda')) return '動物界 → 無脊椎動物 → 節肢動物';
    if(ids.includes('p-echinodermata')) return '動物界 → 無脊椎動物 → 棘皮動物';
    return '動物界';
  }
  if(ids.includes('k-plantae')){
    if(ids.includes('p-bryophyta')) return '植物界 → 孢子植物 → 蘚苔類';
    if(ids.includes('p-pteridophyta')) return '植物界 → 孢子植物 → 蕨類';
    if(ids.includes('p-gymnospermae')) return '植物界 → 種子植物 → 裸子植物';
    if(ids.includes('p-angiospermae')){
      if(ids.includes('c-liliopsida')) return '植物界 → 種子植物 → 被子植物 → 單子葉植物';
      return '植物界 → 種子植物 → 被子植物 → 雙子葉植物';
    }
    return '植物界';
  }
  if(ids.includes('k-fungi')){
    if(ids.includes('p-basidio')) return '真菌界 → 菇類';
    if(ids.includes('c-saccharo') || ids.includes('o-saccharo-2')) return '真菌界 → 酵母';
    if(ids.includes('p-mucoromycota') || ids.includes('c-eurotio') || ids.includes('c-sordariomycetes')) return '真菌界 → 黴菌';
    return '真菌界';
  }
  if(ids.includes('k-protista')){
    if(ids.some(id => ['p-ciliophora','p-rhizopoda','p-apicomplexa','p-euglenozoa'].includes(id))) return '原生生物界 → 原生動物';
    if(ids.some(id => ['p-chlorophyta','p-bacillariophyta','p-rhodophyta'].includes(id))) return '原生生物界 → 藻類';
    if(ids.includes('p-oomycota')) return '原生生物界 → 原生菌類';
    return '原生生物界';
  }
  if(ids.includes('d-bacteria')) return '三域系統 → 細菌域';
  if(ids.includes('d-archaea')) return '三域系統 → 古菌域';
  return '完整分類支線';
}
function getTeachingFields(node){
  const base = teachingMap[node.id] || {};
  const examples = base.examples || descendantSpecies(node, 4).join('、') || node.name_zh;
  const features = base.features || node.description || '可由此節點理解其基本特徵。';
  const textbook = base.textbook || getTextbookLineage(node);
  const siblings = siblingNames(node, 3);
  const compare = base.compare || (siblings.length
    ? `可和同層的 ${siblings.join('、')} 比較外形、生活方式或繁殖方式。`
    : '可向上一層比較它與同類群的共同特徵。');
  const habitat = base.habitat || '可依教材例子理解其常見生活環境。';
  const exam = base.exam || `國中常考：判斷它在「${textbook}」中的位置與代表特徵。`;
  return {features, examples, textbook, compare, habitat, exam};
}
function getGroupedChildren(node){
  const children = node.children || [];
  if(displayMode !== 'textbook' || !children.length){
    return [{title:'', note:'', nodes:children}];
  }
  const spec = textbookGroupMap[node.id];
  if(!spec){
    return [{title:'完整下一層', note:'此節點未另外分教材主幹，直接顯示完整下一層。', nodes:children}];
  }
  const used = new Set();
  const groups = spec.map(group => {
    const nodes = group.ids.map(id => children.find(child => child.id === id)).filter(Boolean);
    nodes.forEach(nodeItem => used.add(nodeItem.id));
    return {...group, nodes};
  }).filter(group => group.nodes.length);
  const others = children.filter(child => !used.has(child.id));
  if(others.length){
    groups.push({title:'教材補充支線', note:'保留完整分類資料，不在主幹也可繼續向下探索。', nodes:others});
  }
  return groups;
}
function cardHTML(node, searchMode=false){
  const cnt = (node.children || []).length;
  return `
      <div class="circle-card" data-id="${node.id}">
        <div class="circle-shell">
          <div class="circle-ring">
            <div class="circle-core">
              <div class="circle-en">${node.name_en}</div>
              <div class="circle-zh">${node.name_zh}</div>
              <div class="circle-rank">${rankLabel(node.rank)}</div>
            </div>
          </div>
        </div>
        <div class="circle-hint">${searchMode ? '▼ 點擊跳轉' : '▼ 點擊進入下一層'}</div>
        <div class="circle-note">${cnt ? `下位分類 ${cnt} 個` : '已到最細分類'}</div>
      </div>
  `;
}
function bindCards(view, searchMode=false){
  view.querySelectorAll('.circle-card').forEach(card => {
    card.addEventListener('click', () => {
      const node = idMap.get(card.dataset.id);
      activeDetail = node;
      if(searchMode){
        currentNode = node;
        lastDirection = 'search-fade';
        renderAll();
      } else if((node.children || []).length){
        currentNode = node;
        lastDirection = 'enter-right';
        renderAll();
      } else {
        renderDetail();
      }
    });
  });
}
function createGalleryView(groupList, animClass, searchMode=false){
  const view = document.createElement('div');
  view.className = `gallery-view ${searchMode ? 'search-fade' : animClass}`;
  if(searchMode){
    if(!groupList.length){
      view.innerHTML = `<div class="empty">找不到符合條件的分類。</div>`;
      return view;
    }
    view.innerHTML = groupList.map(node => cardHTML(node, true)).join('');
    bindCards(view, true);
    return view;
  }
  if(!groupList.length){
    view.innerHTML = `<div class="empty">這個節點已經是最下層，沒有下一層分類。</div>`;
    return view;
  }
  let html = '';
  groupList.forEach(group => {
    if(group.title){
      html += `
        <div class="group-header">
          <div class="group-title">${group.title}</div>
          <div class="group-sub">${group.note || ''}</div>
        </div>
      `;
    }
    html += (group.nodes || []).map(node => cardHTML(node, false)).join('');
  });
  if(!html){
    html = `<div class="empty">這個節點已經是最下層，沒有下一層分類。</div>`;
  }
  view.innerHTML = html;
  bindCards(view, false);
  return view;
}

function searchNodes(keyword, rank){
  const kw = keyword.trim().toLowerCase();
  return allNodes().filter(node => {
    const rankOk = rank === 'all' || node.rank === rank;
    const teach = getTeachingFields(node);
    const hay = `${node.name_en} ${node.name_zh} ${node.description || ''} ${teach.textbook} ${teach.examples}`.toLowerCase();
    return rankOk && hay.includes(kw);
  });
}
function showSearchResults(hits, keyword){
  galleryTitle.textContent = `搜尋結果：${hits.length} 筆`;
  galleryStage.innerHTML = '';
  galleryStage.appendChild(createGalleryView(hits, 'search-fade', true));
  detailBox.style.display = 'none';
  activeDetail = null;
}
function randomNode(){
  const nodes = allNodes();
  const node = nodes[Math.floor(Math.random() * nodes.length)];
  currentNode = node;
  activeDetail = node;
  lastDirection = 'search-fade';
  renderAll();
}
document.getElementById('searchBtn').addEventListener('click', () => {
  const kw = document.getElementById('searchInput').value.trim();
  const rank = document.getElementById('rankFilter').value;
  if(!kw) return;
  const hits = searchNodes(kw, rank);
  showSearchResults(hits, kw);
});
document.getElementById('homeBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('rankFilter').value = 'all';
  currentNode = taxonomyData;
  activeDetail = null;
  lastDirection = 'enter-left';
  renderAll();
});
document.getElementById('viewMode').addEventListener('change', (e) => {
  displayMode = e.target.value;
  lastDirection = 'search-fade';
  renderAll();
});
document.getElementById('upBtn').addEventListener('click', goUp);
document.getElementById('randomBtn').addEventListener('click', randomNode);
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('searchBtn').click();
});

renderAll();
</script>
</body>
</html>
