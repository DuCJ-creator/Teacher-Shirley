<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✦ 詩意修辭學苑 | Shirley's Language Arts</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf6ed;
            font-family: 'Cormorant Garamond', 'Inter', Georgia, serif;
            color: #2c2418;
            min-height: 100vh;
        }

        :root {
            --paper: #faf6ed;
            --ink: #2c2418;
            --sage: #7c9a7a;
            --rose: #c97b6e;
            --gold: #c9a87b;
            --dusty-teal: #6b8b8a;
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(201, 168, 123, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 70%, rgba(124, 154, 122, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        .poetic-header {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            border-bottom: 1px solid rgba(201, 168, 123, 0.3);
            margin-bottom: 1rem;
        }

        .header-eyebrow {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.8rem;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 500;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        h1 em {
            font-style: italic;
            color: var(--rose);
            font-weight: 500;
        }

        .subtitle {
            font-size: 1rem;
            color: #6b5a48;
            margin-top: 0.3rem;
            font-style: italic;
        }

        .header-ornament {
            margin-top: 0.8rem;
            font-size: 1rem;
            color: var(--gold);
            opacity: 0.5;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin: 1rem 0 1.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 1.2rem;
            background: transparent;
            border: 1.5px solid rgba(201, 168, 123, 0.4);
            border-radius: 2rem;
            color: #5a4a3a;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .tab-btn.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(201, 168, 123, 0.1);
            border-color: var(--gold);
        }

        .search-section {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 1rem;
            pointer-events: none;
        }

        #globalSearch {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            border: 1.5px solid rgba(201, 168, 123, 0.3);
            border-radius: 2rem;
            background: white;
            color: var(--ink);
            outline: none;
            transition: all 0.2s;
        }

        #globalSearch:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 123, 0.15);
        }

        .clear-search {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #aaa;
            display: none;
        }

        .search-count {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            color: var(--sage);
            margin-top: 0.4rem;
            text-align: right;
        }

        .back-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: none;
            border: 1.5px solid rgba(201, 168, 123, 0.4);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-family: 'Inter', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #5a4a3a;
        }

        .back-btn:hover {
            background: rgba(201, 168, 123, 0.1);
        }

        .strand-title {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .strand-title h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--ink);
            text-transform: capitalize;
        }

        .strand-badge {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            background: var(--sage);
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 1rem;
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            margin-left: auto;
        }

        .view-btn {
            background: none;
            border: 1.5px solid rgba(201, 168, 123, 0.3);
            border-radius: 0.5rem;
            padding: 0.3rem 0.7rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.15s;
            color: #aaa;
        }

        .view-btn.active {
            background: var(--gold);
            color: white;
            border-color: var(--gold);
        }

        .strand-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .strand-card {
            background: white;
            border: 1px solid rgba(201, 168, 123, 0.25);
            border-radius: 1rem;
            padding: 1.3rem;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .strand-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--strand-color, var(--gold));
            border-radius: 1rem 0 0 1rem;
        }

        .strand-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: rgba(201, 168, 123, 0.5);
        }

        .strand-icon {
            font-size: 2rem;
            margin-bottom: 0.6rem;
            display: block;
        }

        .strand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ink);
            text-transform: capitalize;
            margin-bottom: 0.2rem;
        }

        .strand-count {
            font-family: 'Inter', monospace;
            font-size: 0.65rem;
            color: var(--sage);
            letter-spacing: 0.05em;
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .word-grid.list-mode {
            grid-template-columns: 1fr;
        }

        .word-card {
            background: white;
            border: 1px solid rgba(201, 168, 123, 0.2);
            border-radius: 0.875rem;
            padding: 1.1rem;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .word-card:hover {
            box-shadow: var(--shadow-sm);
        }

        .word-card.starred {
            border-color: var(--gold);
            background: #fffbf0;
        }

        .word-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .word-english {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
        }

        .word-pos {
            font-family: 'Inter', monospace;
            font-size: 0.65rem;
            color: var(--rose);
            background: #fdeef1;
            padding: 0.1rem 0.5rem;
            border-radius: 0.5rem;
        }

        .word-chinese {
            font-size: 1rem;
            color: var(--dusty-teal);
            margin: 0.5rem 0 0.6rem;
            font-weight: 500;
        }

        .sentences {
            border-top: 1px dashed rgba(201, 168, 123, 0.2);
            padding-top: 0.6rem;
        }

        .sentence-label {
            font-family: 'Inter', monospace;
            font-size: 0.6rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .sentence {
            font-size: 0.8rem;
            line-height: 1.45;
            color: #5a4a3a;
        }

        .sentence.cn {
            color: var(--sage);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        .btn-pronounce, .btn-star {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            padding: 0.25rem 0.7rem;
            border-radius: 1.5rem;
            cursor: pointer;
            transition: all 0.15s;
            border: 1.5px solid rgba(201, 168, 123, 0.3);
            background: white;
        }

        .btn-pronounce {
            background: var(--dusty-teal);
            border-color: var(--dusty-teal);
            color: white;
        }

        .btn-pronounce:hover {
            background: #5a7a78;
        }

        .btn-star:hover {
            color: var(--gold);
            border-color: var(--gold);
        }

        .flashcard-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 0;
        }

        .fc-controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .fc-btn {
            font-family: 'Inter', monospace;
            font-size: 0.8rem;
            padding: 0.45rem 1.2rem;
            border-radius: 2rem;
            border: 1.5px solid rgba(201, 168, 123, 0.4);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            color: #5a4a3a;
        }

        .fc-btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: white;
        }

        .fc-btn:hover {
            background: rgba(201, 168, 123, 0.1);
        }

        .flashcard-scene {
            width: min(540px, 90vw);
            height: 360px;
            perspective: 1200px;
            cursor: pointer;
            position: relative;
        }

        .flashcard-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .flashcard-inner.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: white;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.8rem;
            text-align: center;
            border: 1px solid rgba(201, 168, 123, 0.2);
        }

        .flashcard-face.back {
            transform: rotateY(180deg);
            background: #fffbf4;
        }

        .fc-word {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        .fc-hint {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            color: var(--gold);
        }

        .fc-meaning {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--dusty-teal);
            margin-bottom: 1rem;
        }

        .fc-sentence {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #5a4a3a;
            max-width: 90%;
        }

        .fc-sentence.cn {
            color: var(--sage);
            margin-top: 0.3rem;
        }

        .fc-star-btn {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .flashcard-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .fc-nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            border: 1.5px solid rgba(201, 168, 123, 0.4);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .fc-nav-btn:hover {
            background: rgba(201, 168, 123, 0.1);
        }

        .fc-progress {
            font-family: 'Inter', monospace;
            font-size: 0.8rem;
            color: var(--sage);
            min-width: 70px;
            text-align: center;
        }

        .fc-deck-info {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            color: var(--gold);
        }

        .strand-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .strand-chip {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            background: white;
            border: 1px solid rgba(201, 168, 123, 0.3);
            cursor: pointer;
            transition: all 0.15s;
        }

        .strand-chip.active {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
        }

        .starred-view {
            display: none;
        }

        .starred-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .starred-card {
            background: white;
            border: 1px solid rgba(201, 168, 123, 0.25);
            border-radius: 1rem;
            padding: 1rem;
        }

        .starred-word {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .starred-meaning {
            font-size: 0.9rem;
            color: var(--dusty-teal);
        }

        .starred-strand {
            font-family: 'Inter', monospace;
            font-size: 0.65rem;
            color: var(--gold);
            margin-top: 0.4rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #aaa;
            font-style: italic;
        }

        .search-results {
            display: none;
        }

        .result-group {
            margin-bottom: 1.5rem;
        }

        .result-group-title {
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 0.5rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid rgba(201, 168, 123, 0.2);
        }

        .result-card {
            background: white;
            border: 1px solid rgba(201, 168, 123, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem;
        }

        mark {
            background: rgba(201, 168, 123, 0.3);
            border-radius: 2px;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--ink);
            color: var(--paper);
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-family: 'Inter', monospace;
            font-size: 0.8rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container { padding: 0 1rem; }
            .strand-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .word-grid { grid-template-columns: 1fr; }
            .flashcard-scene { height: 300px; }
            .fc-word { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="poetic-header">
        <div class="header-eyebrow">✦ SHIRLEY'S LITERARY ATELIER ✦</div>
        <h1>Language <em>Arts</em></h1>
        <p class="subtitle">詞藻的殿堂 · 語文的美學思維</p>
        <div class="header-ornament">✧ 詩意 · 修辭 · 思辨 ✧</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="strands">📖 學科領域</button>
        <button class="tab-btn" data-tab="flashcard">🃏 閃卡學習</button>
        <button class="tab-btn" data-tab="starred">⭐ 我的收藏</button>
    </div>

    <div class="search-section">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearch" placeholder="搜尋單詞、釋義或例句...">
        <button class="clear-search" id="clearBtn">✕</button>
        <div class="search-count" id="searchCount"></div>
    </div>

    <!-- 學科領域首頁 -->
    <div id="strandsView" class="strand-grid"></div>

    <!-- 瀏覽模式（點學科後進入） -->
    <div id="browseView" style="display: none;">
        <div class="back-header">
            <button class="back-btn" id="browseBackBtn">← 返回學科列表</button>
            <div class="view-toggle">
                <button class="view-btn active" id="gridViewBtn" onclick="setListMode(false)">⊞ 網格</button>
                <button class="view-btn" id="listViewBtn" onclick="setListMode(true)">☰ 列表</button>
            </div>
        </div>
        <div class="strand-title" id="browseTitle"></div>
        <div id="wordGrid" class="word-grid"></div>
    </div>

    <!-- 純閃卡模式 -->
    <div id="flashcardView" class="flashcard-container">
        <div class="strand-selector" id="fcStrandSelector"></div>
        <div class="fc-controls">
            <button class="fc-btn" id="shuffleBtn">🔀 隨機</button>
            <button class="fc-btn" id="starredOnlyBtn">⭐ 僅收藏</button>
            <button class="fc-btn primary" id="resetDeckBtn">↺ 重啟</button>
        </div>
        <div class="flashcard-scene" id="flashcardScene">
            <div class="flashcard-inner" id="fcInner">
                <div class="flashcard-face front">
                    <div class="fc-word" id="fcWord">—</div>
                    <div class="fc-hint">✧ 輕觸翻面 ✧</div>
                </div>
                <div class="flashcard-face back">
                    <div class="fc-meaning" id="fcMeaning">—</div>
                    <div class="fc-sentence" id="fcSentE"></div>
                    <div class="fc-sentence cn" id="fcSentC"></div>
                </div>
            </div>
            <button class="fc-star-btn" id="fcStarBtn">☆</button>
        </div>
        <div class="flashcard-nav">
            <button class="fc-nav-btn" id="fcPrevBtn">‹</button>
            <span class="fc-progress" id="fcProgress">0 / 0</span>
            <button class="fc-nav-btn" id="fcNextBtn">›</button>
        </div>
        <div class="fc-deck-info" id="fcDeckInfo"></div>
    </div>

    <!-- 收藏視圖 -->
    <div id="starredView" class="starred-view">
        <div id="starredGrid" class="starred-grid"></div>
    </div>

    <!-- 搜索結果視圖 -->
    <div id="searchResultsView" class="search-results"></div>
</div>

<div id="toast" class="toast">⭐ 已收藏</div>

<script>
    // ========== 原版正確的 Emoji 配置 ==========
    const STRAND_CONFIG = {
        'literary':          { icon: '🌿', color: '#5a7a5c' },
        'narrative':         { icon: '📜', color: '#7a5a2a' },
        'academic':          { icon: '🎓', color: '#3d4f8a' },
        'structure':         { icon: '🏛️', color: '#6a4a8a' },
        'drama':             { icon: '🎭', color: '#b85c6e' },
        'critics':           { icon: '🔍', color: '#2d6a7a' },
        'character-analysis':{ icon: '🪞', color: '#8a5a2a' },
        'grammar':           { icon: '✍️', color: '#2a7a5a' },
        'poetic-devices':    { icon: '🌸', color: '#b8629a' },
        'writing':           { icon: '🖋️', color: '#5a7a8a' },
        'reading-skills':    { icon: '👁️', color: '#8a7a2a' },
        'genre':             { icon: '📚', color: '#4a6a8a' },
        'argumentation':     { icon: '⚖️', color: '#7a4a4a' }
    };

    // 模糊匹配函數：處理大小寫、空格、連字符差異
    function getStrandConfig(subject) {
        if (!subject) return { icon: '📖', color: '#c9a87b' };
        
        // 標準化：轉小寫，將空格和底線替換為連字符
        let normalized = subject.toLowerCase().trim();
        normalized = normalized.replace(/[\s_]+/g, '-');
        
        // 直接匹配
        if (STRAND_CONFIG[normalized]) {
            return STRAND_CONFIG[normalized];
        }
        
        // 常見別名匹配（處理 CSV 中可能的不同寫法）
        const aliasMap = {
            'reading-skills': ['reading', 'readingskills', 'reading-skill', 'reading_skills'],
            'character-analysis': ['character', 'characteranalysis', 'character-analysis', 'character_analysis', 'characteranalysi'],
            'poetic-devices': ['poetic', 'poetry', 'poeticdevices', 'poetic-device', 'poetic_devices'],
            'argumentation': ['argument', 'arguments', 'argumentative']
        };
        
        for (const [key, aliases] of Object.entries(aliasMap)) {
            if (aliases.includes(normalized) || aliases.some(a => normalized.includes(a))) {
                return STRAND_CONFIG[key];
            }
        }
        
        return { icon: '📖', color: '#c9a87b' };
    }

    // ========== 全域狀態 ==========
    let rawData = {};
    let allWordsList = [];
    let currentBrowseStrand = null;
    let currentTab = 'strands';
    let starredSet = new Set();
    let listMode = false;

    // 閃卡狀態
    let fcDeck = [];
    let fcIndex = 0;
    let fcStarredMode = false;
    let fcCurrentStrand = null;

    // ========== 從 CSV 獲取數據 ==========
    async function fetchCSVData() {
        const csvUrl = 'https://ducj-creator.github.io/Teacher-Shirley/subject/language%20art.csv';
        try {
            const response = await fetch(csvUrl);
            if (!response.ok) throw new Error('CSV 加載失敗');
            const csvText = await response.text();
            const result = Papa.parse(csvText, { header: true, skipEmptyLines: true });
            
            const tempData = {};
            for (const row of result.data) {
        let subject = row.subject || row.strand || row.category;
        if (!subject) continue;  // 跳過沒有 subject 的資料行
        if (!tempData[subject]) tempData[subject] = [];
                tempData[subject].push({
                    word: row.word || row.term || '',
                    pos: row.pos || row.part_of_speech || '',
                    meaning: row.meaning || row.definition || '',
                    sentence_e: row.sentence_e || row.example_en || row['sentence e'] || '',
                    sentence_c: row.sentence_c || row.example_zh || row['sentence c'] || ''
                });
            }
            return tempData;
        } catch (error) {
            console.error('讀取 CSV 失敗:', error);
            return null;
        }
    }

    // ========== 初始化 ==========
    async function init() {
        const data = await fetchCSVData();
        if (data && Object.keys(data).length > 0) {
            rawData = data;
        } else {
            document.getElementById('strandsView').innerHTML = '<div class="empty-state">⚠️ 無法載入資料</div>';
            return;
        }

        allWordsList = [];
        for (const [strand, words] of Object.entries(rawData)) {
            for (const w of words) {
                allWordsList.push({ ...w, strand: strand });
            }
        }

        const saved = localStorage.getItem('la_starred_v3');
        if (saved) starredSet = new Set(JSON.parse(saved));

        renderStrands();
        renderFcStrandSelector();
        updateStarCountUI();
    }

    function renderStrands() {
        const container = document.getElementById('strandsView');
        container.innerHTML = '';
        const strands = Object.entries(rawData);
        strands.forEach(([name, words]) => {
            const cfg = getStrandConfig(name);
            const card = document.createElement('div');
            card.className = 'strand-card';
            card.style.setProperty('--strand-color', cfg.color);
            card.innerHTML = `
                <span class="strand-icon">${cfg.icon}</span>
                <div class="strand-name">${name.replace(/[-_]/g, ' ')}</div>
                <div class="strand-count">${words.length} 個詞條</div>
            `;
            card.onclick = () => openBrowseStrand(name);
            container.appendChild(card);
        });
    }

    // 瀏覽模式（點學科後）
    function openBrowseStrand(strandName) {
        currentBrowseStrand = strandName;
        currentTab = 'browse';
        
        document.getElementById('strandsView').style.display = 'none';
        document.getElementById('browseView').style.display = 'block';
        document.getElementById('flashcardView').style.display = 'none';
        document.getElementById('starredView').style.display = 'none';
        document.getElementById('searchResultsView').style.display = 'none';
        
        const cfg = getStrandConfig(strandName);
        document.getElementById('browseTitle').innerHTML = `
            <span style="font-size:1.8rem">${cfg.icon}</span>
            <h2>${strandName.replace(/[-_]/g, ' ')}</h2>
            <span class="strand-badge">${rawData[strandName].length} 個詞條</span>
        `;
        
        renderWords(rawData[strandName], strandName);
    }

    function setListMode(mode) {
        listMode = mode;
        document.getElementById('gridViewBtn').classList.toggle('active', !mode);
        document.getElementById('listViewBtn').classList.toggle('active', mode);
        document.getElementById('wordGrid').classList.toggle('list-mode', mode);
        if (currentBrowseStrand) {
            renderWords(rawData[currentBrowseStrand], currentBrowseStrand);
        }
    }

    function renderWords(words, strand, highlight = '') {
        const grid = document.getElementById('wordGrid');
        grid.innerHTML = '';
        words.forEach((w, idx) => {
            grid.appendChild(buildWordCard(w, strand, highlight, idx));
        });
    }

    function buildWordCard(w, strand, highlight = '', idx = 0) {
        const key = `${strand}::${w.word}`;
        const isStarred = starredSet.has(key);
        const hl = (str) => highlight ? str.replace(new RegExp(`(${highlight})`, 'gi'), '<mark>$1</mark>') : str;

        const card = document.createElement('div');
        card.className = `word-card ${isStarred ? 'starred' : ''}`;
        card.style.animationDelay = `${idx * 0.02}s`;
        
        card.innerHTML = `
            <div class="word-card-head">
                <div class="word-english">${hl(w.word)}</div>
                <div class="word-pos">${w.pos || ''}</div>
            </div>
            <div class="word-chinese">${hl(w.meaning)}</div>
            <div class="sentences">
                <div class="sentence-label">EN</div>
                <div class="sentence">${hl(w.sentence_e || '')}</div>
                <div class="sentence-label" style="margin-top:0.4rem">中</div>
                <div class="sentence cn">${hl(w.sentence_c || '')}</div>
            </div>
            <div class="card-actions">
                <button class="btn-pronounce" onclick="pronounce('${w.word.replace(/'/g, "\\'")}')">🔊 發音</button>
                <button class="btn-star" onclick="toggleStar('${key}', this, '${strand}')">${isStarred ? '⭐' : '☆'}</button>
            </div>
        `;
        return card;
    }

    function pronounce(word) {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US';
            u.rate = 0.85;
            speechSynthesis.speak(u);
        }
    }

    function toggleStar(key, btn, strand) {
        if (starredSet.has(key)) {
            starredSet.delete(key);
            if (btn) btn.textContent = '☆';
            if (btn && btn.closest('.word-card')) btn.closest('.word-card').classList.remove('starred');
        } else {
            starredSet.add(key);
            if (btn) btn.textContent = '⭐';
            if (btn && btn.closest('.word-card')) btn.closest('.word-card').classList.add('starred');
            showToast('⭐ 已收藏');
        }
        saveStarred();
        if (currentTab === 'starred') renderStarredView();
        if (fcDeck.length && fcDeck[fcIndex]) {
            const currentKey = `${fcDeck[fcIndex].strand}::${fcDeck[fcIndex].word}`;
            if (currentKey === key) renderFcCard();
        }
    }

    function saveStarred() {
        localStorage.setItem('la_starred_v3', JSON.stringify([...starredSet]));
        updateStarCountUI();
    }

    function updateStarCountUI() {
        const starTab = document.querySelector('.tab-btn[data-tab="starred"]');
        if (starTab) starTab.innerHTML = `⭐ 收藏 (${starredSet.size})`;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1500);
    }

    // ========== 純閃卡模式 ==========
    function renderFcStrandSelector() {
        const container = document.getElementById('fcStrandSelector');
        container.innerHTML = '<button class="strand-chip active" data-strand="all">📚 全部</button>';
        Object.keys(rawData).forEach(strand => {
            const cfg = getStrandConfig(strand);
            const chip = document.createElement('button');
            chip.className = 'strand-chip';
            chip.dataset.strand = strand;
            chip.innerHTML = `${cfg.icon} ${strand.replace(/[-_]/g, ' ')}`;
            chip.onclick = () => selectFcStrand(strand);
            container.appendChild(chip);
        });
    }

    function selectFcStrand(strand) {
        fcCurrentStrand = strand === 'all' ? null : strand;
        fcStarredMode = false;
        document.querySelectorAll('#fcStrandSelector .strand-chip').forEach(chip => {
            chip.classList.remove('active');
            if ((strand === 'all' && chip.dataset.strand === 'all') || chip.dataset.strand === strand) {
                chip.classList.add('active');
            }
        });
        document.getElementById('starredOnlyBtn').textContent = '⭐ 僅收藏';
        updateFcDeck();
    }

    function updateFcDeck() {
        if (fcStarredMode) {
            fcDeck = allWordsList.filter(w => starredSet.has(`${w.strand}::${w.word}`));
        } else if (fcCurrentStrand) {
            fcDeck = rawData[fcCurrentStrand].map(w => ({ ...w, strand: fcCurrentStrand }));
        } else {
            fcDeck = allWordsList.map(w => ({ ...w }));
        }
        fcIndex = 0;
        if (fcDeck.length === 0) {
            document.getElementById('fcWord').textContent = '📭 尚無卡片';
            document.getElementById('fcStarBtn').style.display = 'none';
        } else {
            document.getElementById('fcStarBtn').style.display = 'flex';
            renderFcCard();
        }
    }

    function renderFcCard() {
        const inner = document.getElementById('fcInner');
        inner.classList.remove('flipped');
        
        if (!fcDeck.length) {
            document.getElementById('fcWord').textContent = '📭 尚無卡片';
            document.getElementById('fcMeaning').textContent = '—';
            document.getElementById('fcSentE').textContent = '';
            document.getElementById('fcSentC').textContent = '';
            document.getElementById('fcProgress').textContent = '0 / 0';
            document.getElementById('fcDeckInfo').textContent = '請選擇學科或取消「僅收藏」';
            return;
        }
        
        const card = fcDeck[fcIndex];
        const key = `${card.strand}::${card.word}`;
        const isStarred = starredSet.has(key);
        
        document.getElementById('fcWord').textContent = card.word || '—';
        document.getElementById('fcMeaning').textContent = card.meaning || '—';
        document.getElementById('fcSentE').textContent = card.sentence_e || '';
        document.getElementById('fcSentC').textContent = card.sentence_c || '';
        document.getElementById('fcProgress').textContent = `${fcIndex + 1} / ${fcDeck.length}`;
        document.getElementById('fcStarBtn').textContent = isStarred ? '⭐' : '☆';
        
        const strandInfo = card.strand ? card.strand.replace(/[-_]/g, ' ') : '';
        document.getElementById('fcDeckInfo').textContent = `${fcDeck.length} 張卡片 · ${strandInfo}`;
    }

    function flipCard() {
        document.getElementById('fcInner').classList.toggle('flipped');
        const isFlipped = document.getElementById('fcInner').classList.contains('flipped');
        if (isFlipped && fcDeck[fcIndex]) {
            const u = new SpeechSynthesisUtterance(fcDeck[fcIndex].word);
            u.lang = 'en-US';
            u.rate = 0.85;
            speechSynthesis.speak(u);
        }
    }

    function fcNext() { if (fcDeck.length) { fcIndex = (fcIndex + 1) % fcDeck.length; renderFcCard(); } }
    function fcPrev() { if (fcDeck.length) { fcIndex = (fcIndex - 1 + fcDeck.length) % fcDeck.length; renderFcCard(); } }
    function fcShuffle() {
        for (let i = fcDeck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fcDeck[i], fcDeck[j]] = [fcDeck[j], fcDeck[i]];
        }
        fcIndex = 0;
        renderFcCard();
    }
    function toggleFcStarredOnly() {
        fcStarredMode = !fcStarredMode;
        document.getElementById('starredOnlyBtn').textContent = fcStarredMode ? '📚 全部單詞' : '⭐ 僅收藏';
        updateFcDeck();
    }
    function resetFcDeck() {
        fcStarredMode = false;
        document.getElementById('starredOnlyBtn').textContent = '⭐ 僅收藏';
        updateFcDeck();
    }
    function toggleStarCurrentCard() {
        if (!fcDeck.length) return;
        const card = fcDeck[fcIndex];
        const key = `${card.strand}::${card.word}`;
        if (starredSet.has(key)) {
            starredSet.delete(key);
            showToast('☆ 已取消收藏');
        } else {
            starredSet.add(key);
            showToast('⭐ 已收藏');
        }
        saveStarred();
        renderFcCard();
        if (currentTab === 'starred') renderStarredView();
        if (currentBrowseStrand) renderWords(rawData[currentBrowseStrand], currentBrowseStrand);
    }

    // 收藏視圖
    function renderStarredView() {
        const container = document.getElementById('starredGrid');
        container.innerHTML = '';
        const starredWords = allWordsList.filter(w => starredSet.has(`${w.strand}::${w.word}`));
        if (starredWords.length === 0) {
            container.innerHTML = '<div class="empty-state">✧ 尚未收藏任何單詞 ✧<br>在瀏覽模式或閃卡模式點擊 ☆ 即可收藏</div>';
            return;
        }
        starredWords.forEach(w => {
            const cfg = getStrandConfig(w.strand);
            const card = document.createElement('div');
            card.className = 'starred-card';
            card.innerHTML = `
                <div class="starred-word">${cfg.icon} ${w.word} <span style="font-size:0.7rem; color:#c9a87b;">${w.pos || ''}</span></div>
                <div class="starred-meaning">${w.meaning || ''}</div>
                <div class="starred-strand">${w.strand ? w.strand.replace(/[-_]/g, ' ') : ''}</div>
            `;
            container.appendChild(card);
        });
    }

    // 搜索功能
    function handleSearch() {
        const keyword = document.getElementById('globalSearch').value.trim();
        const clearBtn = document.getElementById('clearBtn');
        clearBtn.style.display = keyword ? 'block' : 'none';
        
        if (!keyword) {
            document.getElementById('searchCount').textContent = '';
            document.getElementById('searchResultsView').style.display = 'none';
            if (currentTab === 'strands') document.getElementById('strandsView').style.display = 'grid';
            else if (currentTab === 'browse') document.getElementById('browseView').style.display = 'block';
            else if (currentTab === 'flashcard') document.getElementById('flashcardView').style.display = 'flex';
            else if (currentTab === 'starred') document.getElementById('starredView').style.display = 'block';
            return;
        }
        
        const lower = keyword.toLowerCase();
        const results = allWordsList.filter(w => 
            w.word.toLowerCase().includes(lower) ||
            (w.meaning && w.meaning.includes(keyword)) ||
            (w.sentence_e && w.sentence_e.toLowerCase().includes(lower)) ||
            (w.sentence_c && w.sentence_c.includes(keyword))
        );
        
        document.getElementById('searchCount').textContent = `找到 ${results.length} 個結果`;
        document.getElementById('strandsView').style.display = 'none';
        document.getElementById('browseView').style.display = 'none';
        document.getElementById('flashcardView').style.display = 'none';
        document.getElementById('starredView').style.display = 'none';
        
        const rv = document.getElementById('searchResultsView');
        rv.style.display = 'block';
        rv.innerHTML = '';
        
        if (results.length === 0) {
            rv.innerHTML = '<div class="empty-state">🔍 沒有找到相關單詞</div>';
            return;
        }
        
        const grouped = {};
        results.forEach(r => { if (!grouped[r.strand]) grouped[r.strand] = []; grouped[r.strand].push(r); });
        
        for (const [strand, words] of Object.entries(grouped)) {
            const cfg = getStrandConfig(strand);
            const groupDiv = document.createElement('div');
            groupDiv.className = 'result-group';
            groupDiv.innerHTML = `<div class="result-group-title">${cfg.icon} ${strand.replace(/[-_]/g, ' ')}</div>`;
            const grid = document.createElement('div');
            grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.8rem;margin-bottom:1rem';
            words.forEach(w => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="starred-word">${highlightText(w.word, keyword)}</div>
                    <div class="starred-meaning">${highlightText(w.meaning, keyword)}</div>
                `;
                grid.appendChild(card);
            });
            groupDiv.appendChild(grid);
            rv.appendChild(groupDiv);
        }
    }

    function highlightText(text, keyword) {
        if (!text) return '';
        const regex = new RegExp(`(${keyword})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }

    function clearSearch() {
        document.getElementById('globalSearch').value = '';
        document.getElementById('clearBtn').style.display = 'none';
        document.getElementById('searchCount').textContent = '';
        document.getElementById('searchResultsView').style.display = 'none';
        if (currentTab === 'strands') document.getElementById('strandsView').style.display = 'grid';
        else if (currentTab === 'browse') document.getElementById('browseView').style.display = 'block';
        else if (currentTab === 'flashcard') document.getElementById('flashcardView').style.display = 'flex';
        else if (currentTab === 'starred') document.getElementById('starredView').style.display = 'block';
    }

    function goBackToStrands() {
        currentBrowseStrand = null;
        currentTab = 'strands';
        document.getElementById('browseView').style.display = 'none';
        document.getElementById('strandsView').style.display = 'grid';
        document.getElementById('flashcardView').style.display = 'none';
        document.getElementById('starredView').style.display = 'none';
        document.getElementById('searchResultsView').style.display = 'none';
        clearSearch();
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('.tab-btn[data-tab="strands"]').classList.add('active');
    }

    function showTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
        
        document.getElementById('strandsView').style.display = 'none';
        document.getElementById('browseView').style.display = 'none';
        document.getElementById('flashcardView').style.display = 'none';
        document.getElementById('starredView').style.display = 'none';
        document.getElementById('searchResultsView').style.display = 'none';
        
        if (tabId === 'strands') {
            document.getElementById('strandsView').style.display = 'grid';
            clearSearch();
        } else if (tabId === 'flashcard') {
            document.getElementById('flashcardView').style.display = 'flex';
            if (!fcDeck.length) updateFcDeck();
            renderFcCard();
        } else if (tabId === 'starred') {
            document.getElementById('starredView').style.display = 'block';
            renderStarredView();
            clearSearch();
        }
    }

    // 事件綁定
    document.getElementById('browseBackBtn').addEventListener('click', goBackToStrands);
    document.getElementById('flashcardScene').addEventListener('click', flipCard);
    document.getElementById('fcNextBtn').addEventListener('click', fcNext);
    document.getElementById('fcPrevBtn').addEventListener('click', fcPrev);
    document.getElementById('shuffleBtn').addEventListener('click', fcShuffle);
    document.getElementById('starredOnlyBtn').addEventListener('click', toggleFcStarredOnly);
    document.getElementById('resetDeckBtn').addEventListener('click', resetFcDeck);
    document.getElementById('globalSearch').addEventListener('input', handleSearch);
    document.getElementById('clearBtn').addEventListener('click', clearSearch);
    document.getElementById('fcStarBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleStarCurrentCard(); });
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => showTab(btn.dataset.tab));
    });

    init();
</script>
</body>
</html>
