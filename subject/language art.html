<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Shirley's Language Arts Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1209;
    --parchment: #fdf6e3;
    --cream: #f7eed8;
    --gold: #c9973a;
    --gold-light: #e8c56d;
    --rose: #b85c6e;
    --teal: #2d7d7a;
    --indigo: #3d4f8a;
    --sage: #5a7a5c;
    --mist: #8fa0b8;
    --warm-shadow: rgba(201,151,58,0.15);
    --card-bg: rgba(253,246,227,0.92);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND TEXTURE ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,151,58,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, rgba(184,92,110,0.06) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(45,125,122,0.05) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: relative; z-index: 10;
    text-align: center;
    padding: 3.5rem 2rem 2rem;
    border-bottom: 1px solid rgba(201,151,58,0.3);
  }
  header::after {
    content: '❦';
    display: block;
    color: var(--gold);
    font-size: 1.4rem;
    margin-top: 0.8rem;
    opacity: 0.7;
  }
  .header-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  h1 em {
    font-style: italic;
    color: var(--rose);
  }
  .subtitle {
    font-size: 1.05rem;
    color: #5a4a2a;
    margin-top: 0.6rem;
    font-style: italic;
    opacity: 0.85;
  }

  /* ── SEARCH BAR ── */
  .search-wrap {
    position: sticky; top: 0; z-index: 100;
    background: rgba(253,246,227,0.97);
    backdrop-filter: blur(12px);
    padding: 0.9rem 1.5rem;
    border-bottom: 1px solid rgba(201,151,58,0.2);
    display: flex; align-items: center; gap: 0.8rem;
  }
  #globalSearch {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    padding: 0.6rem 1rem 0.6rem 2.6rem;
    border: 1.5px solid rgba(201,151,58,0.4);
    border-radius: 2rem;
    background: white;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #globalSearch:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--warm-shadow);
  }
  .search-wrap .search-icon {
    position: absolute;
    left: 2.5rem;
    color: var(--gold);
    font-size: 0.95rem;
    pointer-events: none;
  }
  .search-wrap { position: relative; }
  .search-wrap input { padding-left: 2.6rem; }
  .clear-search {
    background: none; border: none; cursor: pointer;
    color: var(--mist); font-size: 1.1rem; padding: 0.2rem;
    transition: color 0.15s;
    display: none;
  }
  .clear-search:hover { color: var(--rose); }
  #searchCount {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--mist);
    white-space: nowrap;
  }

  /* ── BACK BUTTON ── */
  #backBtn {
    display: none;
    align-items: center; gap: 0.5rem;
    background: none; border: 1.5px solid rgba(201,151,58,0.4);
    border-radius: 2rem;
    padding: 0.45rem 1.1rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  #backBtn:hover { background: var(--warm-shadow); border-color: var(--gold); }

  /* ── STARRED TOAST ── */
  #starToast {
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999;
    background: var(--gold); color: white;
    padding: 0.6rem 1.2rem; border-radius: 2rem;
    font-family: 'DM Mono', monospace; font-size: 0.8rem;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  #starToast.show { opacity: 1; transform: translateY(0); }

  /* ── MAIN LAYOUT ── */
  main { position: relative; z-index: 1; padding: 1.5rem 1.5rem 4rem; max-width: 1400px; margin: 0 auto; }

  /* ── STRAND GRID (home) ── */
  #strandView { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.2rem; }

  .strand-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid rgba(201,151,58,0.25);
    border-radius: 1rem;
    padding: 1.6rem 1.4rem;
    cursor: pointer;
    transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
    overflow: hidden;
  }
  .strand-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--strand-color, var(--gold));
    border-radius: 1rem 0 0 1rem;
  }
  .strand-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(201,151,58,0.18);
    border-color: rgba(201,151,58,0.5);
  }
  .strand-icon { font-size: 2rem; margin-bottom: 0.7rem; display: block; }
  .strand-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--ink);
    text-transform: capitalize;
    margin-bottom: 0.25rem;
  }
  .strand-count {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--mist);
    letter-spacing: 0.05em;
  }
  .strand-preview {
    margin-top: 0.8rem;
    font-size: 0.85rem;
    color: #7a6040;
    font-style: italic;
    line-height: 1.4;
    opacity: 0.85;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── WORD LIST ── */
  #wordView { display: none; }
  .strand-title-bar {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .strand-title-bar h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem; font-weight: 700;
    text-transform: capitalize;
  }
  .strand-badge {
    font-family: 'DM Mono', monospace; font-size: 0.72rem;
    background: var(--strand-color-current, var(--gold));
    color: white; padding: 0.25rem 0.7rem; border-radius: 1rem;
  }
  .view-toggle {
    display: flex; gap: 0.5rem; margin-left: auto;
  }
  .view-btn {
    background: none; border: 1.5px solid rgba(201,151,58,0.3);
    border-radius: 0.5rem; padding: 0.4rem 0.7rem;
    cursor: pointer; font-size: 1rem; transition: all 0.15s;
    color: var(--mist);
  }
  .view-btn.active { background: var(--gold); color: white; border-color: var(--gold); }

  /* ── WORD CARDS GRID ── */
  #wordGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
  #wordGrid.list-mode { grid-template-columns: 1fr; }

  .word-card {
    background: white;
    border: 1px solid rgba(201,151,58,0.2);
    border-radius: 0.875rem;
    padding: 1.3rem 1.4rem;
    position: relative;
    transition: box-shadow 0.2s, transform 0.2s;
    animation: fadeSlide 0.35s ease both;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .word-card:hover { box-shadow: 0 4px 20px rgba(201,151,58,0.15); transform: translateY(-2px); }
  .word-card.starred { border-color: var(--gold-light); background: #fffbf0; }

  .word-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .word-english {
    font-family: 'Playfair Display', serif;
    font-size: 1.18rem; font-weight: 700;
    color: var(--ink); line-height: 1.2;
  }
  .word-pos {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    color: var(--rose); background: #fdeef1;
    padding: 0.15rem 0.5rem; border-radius: 0.5rem;
    white-space: nowrap; margin-top: 0.15rem;
  }

  .word-chinese {
    font-size: 1.1rem; color: var(--teal);
    margin: 0.5rem 0 0.7rem;
    font-weight: 600; letter-spacing: 0.03em;
  }

  .sentences { border-top: 1px dashed rgba(201,151,58,0.2); padding-top: 0.7rem; }
  .sentence { font-size: 0.88rem; line-height: 1.6; color: #4a3a1a; margin-bottom: 0.4rem; }
  .sentence.cn { color: var(--teal); font-size: 0.9rem; }
  .sentence-label {
    font-family: 'DM Mono', monospace; font-size: 0.62rem;
    color: var(--mist); text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 0.15rem;
  }

  /* ── WORD CARD ACTIONS ── */
  .card-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.8rem; }
  .btn-pronounce {
    background: var(--indigo); color: white;
    border: none; border-radius: 1.5rem;
    padding: 0.3rem 0.85rem; font-size: 0.8rem;
    cursor: pointer; display: flex; align-items: center; gap: 0.3rem;
    transition: background 0.15s;
    font-family: 'DM Mono', monospace;
  }
  .btn-pronounce:hover { background: #2d3a6e; }
  .btn-star {
    background: none; border: 1.5px solid rgba(201,151,58,0.3);
    border-radius: 1.5rem; padding: 0.3rem 0.7rem;
    cursor: pointer; font-size: 0.85rem;
    transition: all 0.15s; color: var(--mist);
  }
  .btn-star:hover, .word-card.starred .btn-star { color: var(--gold); border-color: var(--gold); }
  .btn-flip {
    background: none; border: 1.5px solid rgba(93,130,122,0.3);
    border-radius: 1.5rem; padding: 0.3rem 0.7rem;
    cursor: pointer; font-size: 0.8rem; color: var(--teal);
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }
  .btn-flip:hover { background: rgba(45,125,122,0.08); }

  /* ── FLASHCARD MODE ── */
  #flashcardView {
    display: none; flex-direction: column; align-items: center; gap: 1.5rem;
  }
  .flashcard-controls { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; justify-content: center; }
  .fc-btn {
    font-family: 'Cormorant Garamond', serif; font-size: 1rem;
    padding: 0.55rem 1.4rem; border-radius: 2rem; cursor: pointer;
    border: 1.5px solid rgba(201,151,58,0.4); background: white;
    transition: all 0.2s; color: var(--ink);
  }
  .fc-btn:hover { background: var(--warm-shadow); }
  .fc-btn.primary { background: var(--gold); color: white; border-color: var(--gold); }
  .fc-btn.primary:hover { background: #b8862e; }
  .fc-count { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--mist); }

  .flashcard-scene {
    width: min(500px, 90vw); height: 300px;
    perspective: 1200px; cursor: pointer;
  }
  .flashcard-inner {
    width: 100%; height: 100%;
    position: relative; transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.23,1,0.32,1);
  }
  .flashcard-inner.flipped { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    background: white;
    border: 1.5px solid rgba(201,151,58,0.3);
    border-radius: 1.25rem;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem; text-align: center;
    box-shadow: 0 8px 30px rgba(201,151,58,0.12);
  }
  .flashcard-face.back { transform: rotateY(180deg); background: #fffbf0; }
  .fc-word { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--ink); }
  .fc-hint { font-size: 0.85rem; color: var(--mist); margin-top: 0.5rem; font-style: italic; }
  .fc-meaning { font-size: 1.4rem; color: var(--teal); font-weight: 600; margin-bottom: 0.5rem; }
  .fc-sentence { font-size: 0.9rem; color: #4a3a1a; line-height: 1.55; max-width: 380px; }
  .fc-sentence.cn { color: var(--teal); margin-top: 0.4rem; }

  .flashcard-nav { display: flex; gap: 1.2rem; align-items: center; }
  .fc-nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: white; border: 1.5px solid rgba(201,151,58,0.4);
    cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .fc-nav-btn:hover { background: var(--warm-shadow); transform: scale(1.05); }
  .fc-progress { font-family: 'DM Mono', monospace; font-size: 0.85rem; color: var(--mist); min-width: 60px; text-align: center; }

  /* ── STARRED LIST ── */
  #starredView { display: none; }
  .starred-empty {
    text-align: center; padding: 3rem;
    color: var(--mist); font-style: italic; font-size: 1.1rem;
  }

  /* ── GLOBAL SEARCH RESULTS ── */
  #searchResultsView { display: none; }
  .search-result-strand {
    font-family: 'DM Mono', monospace; font-size: 0.72rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--mist); margin: 1.2rem 0 0.5rem;
  }
  .search-result-strand:first-child { margin-top: 0; }

  /* ── NAV TABS ── */
  .nav-tabs {
    display: flex; gap: 0.5rem; padding: 0.8rem 1.5rem;
    border-bottom: 1px solid rgba(201,151,58,0.2);
    overflow-x: auto; position: relative; z-index: 5;
    background: rgba(253,246,227,0.95);
  }
  .nav-tab {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem; padding: 0.4rem 1rem;
    border: none; background: none; cursor: pointer;
    color: var(--mist); border-radius: 2rem;
    transition: all 0.2s; white-space: nowrap;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .nav-tab.active { background: var(--ink); color: var(--gold-light); }
  .nav-tab .tab-count {
    font-family: 'DM Mono', monospace; font-size: 0.65rem;
    background: rgba(201,151,58,0.15); color: var(--gold);
    padding: 0.1rem 0.4rem; border-radius: 1rem;
  }
  .nav-tab.active .tab-count { background: rgba(255,255,255,0.15); color: var(--gold-light); }

  /* ── DECORATIVE ── */
  .ornament { color: var(--gold); opacity: 0.4; font-size: 1.2rem; }

  /* ── HIGHLIGHT ── */
  mark { background: rgba(201,151,58,0.25); color: inherit; border-radius: 2px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 2rem 1rem 1.5rem; }
    #strandView { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    #wordGrid { grid-template-columns: 1fr; }
  }

  /* ── FLIP CARD IN WORD VIEW ── */
  .word-card.flipped .sentences { display: none; }
  .word-card .flip-back { display: none; }
  .word-card.flipped .flip-back { display: block; }
  .flip-back .sentence { color: var(--teal); }
</style>
</head>
<body>

<header>
  <div class="header-eyebrow">✦ Teacher Shirley's Interactive Platform ✦</div>
  <h1>Language <em>Arts</em></h1>
  <p class="subtitle">語文的世界；詞藻的殿堂 · A universe of words, meanings & poetic expression</p>
</header>

<!-- NAV TABS -->
<nav class="nav-tabs" id="navTabs">
  <button class="nav-tab active" onclick="showTab('strands')" id="tabStrands">
    📖 Strands
  </button>
  <button class="nav-tab" onclick="showTab('flashcard')" id="tabFlash">
    🃏 Flashcard
  </button>
  <button class="nav-tab" onclick="showTab('starred')" id="tabStarred">
    ⭐ Starred <span class="tab-count" id="starCount">0</span>
  </button>
</nav>

<!-- SEARCH + BACK -->
<div class="search-wrap">
  <button id="backBtn" onclick="goBack()">← Back</button>
  <span class="search-icon">🔍</span>
  <input type="text" id="globalSearch" placeholder="Search any word, meaning, or sentence…" oninput="handleSearch(this.value)" />
  <button class="clear-search" id="clearBtn" onclick="clearSearch()">✕</button>
  <span id="searchCount"></span>
</div>

<main>
  <!-- STRAND GRID -->
  <div id="strandView"></div>

  <!-- WORD LIST -->
  <div id="wordView">
    <div class="strand-title-bar" id="strandTitleBar"></div>
    <div id="wordGrid"></div>
  </div>

  <!-- FLASHCARD -->
  <div id="flashcardView">
    <div class="flashcard-controls">
      <button class="fc-btn" onclick="fcShuffle()">🔀 Shuffle</button>
      <button class="fc-btn" onclick="fcStarredOnly()" id="fcStarBtn">⭐ Starred Only</button>
      <button class="fc-btn primary" onclick="fcReset()">↺ Restart</button>
      <span class="fc-count" id="fcDeckInfo"></span>
    </div>
    <div class="flashcard-scene" onclick="flipCard()">
      <div class="flashcard-inner" id="fcInner">
        <div class="flashcard-face front">
          <div class="fc-word" id="fcWord">—</div>
          <div class="fc-hint">Click to reveal meaning</div>
        </div>
        <div class="flashcard-face back">
          <div class="fc-meaning" id="fcMeaning">—</div>
          <div class="fc-sentence" id="fcSentE">—</div>
          <div class="fc-sentence cn" id="fcSentC">—</div>
        </div>
      </div>
    </div>
    <div class="flashcard-nav">
      <button class="fc-nav-btn" onclick="fcPrev()">‹</button>
      <span class="fc-progress" id="fcProgress">0 / 0</span>
      <button class="fc-nav-btn" onclick="fcNext()">›</button>
    </div>
  </div>

  <!-- STARRED VIEW -->
  <div id="starredView">
    <div class="strand-title-bar">
      <h2 style="font-family:'Playfair Display',serif;">⭐ Starred Words</h2>
    </div>
    <div id="starredGrid"></div>
  </div>

  <!-- SEARCH RESULTS VIEW -->
  <div id="searchResultsView"></div>
</main>

<div id="starToast">⭐ Word starred!</div>

<script>

": "denouement", "pos": "n.", "meaning": "(小說/戲劇)結局", "sentence e": "In the final denouement, all the mysteries are finally explained.", "sentence c": "在最終的結局中，所有的謎團終於得到了解釋。"}, {"word": "ellipsis", "pos": "n.", "meaning": "省略；跳脫", "sentence e": "A ten-year ellipsis jumps from the character's childhood to her adulthood.", "sentence c": "一個十年的省略從角色的童年跳到了她的成年時期。"}, {"word": "epilogue", "pos": "n.", "meaning": "後記", "sentence e": "The epilogue reveals what happened to the characters years later.", "sentence c": "後記揭示了角色們多年後的境遇。"}, {"word": "exposition", "pos": "n.", "meaning": "闡述；(故事)背景鋪陳", "sentence e": "The exposition provides the necessary background information about the characters.", "sentence c": "故事的背景鋪陳提供了關於角色的必要背景資訊。"}, {"word": "external focalization", "pos": "n.", "meaning": "外部聚焦", "sentence e": "External focalization only shows external actions without entering any character's mind.", "sentence c": "外部聚焦只展示外部行動，不進入任何角色的內心。"}, {"word": "first-person", "pos": "n.", "meaning": "第一人稱", "sentence e": "First-person narration uses \"I\" to tell the story from a character's perspective.", "sentence c": "第一人稱敘事使用「我」從角色的視角講述故事。"}, {"word": "flashback", "pos": "n.", "meaning": "倒敘", "sentence e": "A flashback reveals the character's traumatic childhood experience.", "sentence c": "倒敘手法揭露了角色悲慘的童年經歷。"}, {"word": "flashforward", "pos": "n.", "meaning": "預敘；閃前", "sentence e": "A flashforward reveals the character's fate at the very end of the play.", "sentence c": "一個預敘鏡頭在戲劇尾聲揭示了角色的命運。"}, {"word": "focalization", "pos": "n.", "meaning": "聚焦；視角", "sentence e": "Focalization determines through whose eyes the story is seen.", "sentence c": "聚焦決定了故事是透過誰的眼睛被看見。"}, {"word": "foreshadowing", "pos": "n.", "meaning": "伏筆", "sentence e": "The dark clouds in the first chapter served as foreshadowing for the coming tragedy.", "sentence c": "第一章中的烏雲是為即將到來的悲劇埋下的伏筆。"}, {"word": "frame story", "pos": "n.", "meaning": "框架故事", "sentence e": "The Thousand and One Nights is a famous frame story.", "sentence c": "《一千零一夜》是一個著名的框架故事。"}, {"word": "in medias res", "pos": "phrase.", "meaning": "從情節中間開始", "sentence e": "The epic begins in medias res, with the hero already on his journey.", "sentence c": "這部史詩從情節中間開始，英雄已踏上旅程。"}, {"word": "internal focalization", "pos": "n.", "meaning": "內部聚焦", "sentence e": "Internal focalization limits the narrative to what a single character knows.", "sentence c": "內部聚焦將敘事限制在單一角色所知的範圍內。"}, {"word": "narrator", "pos": "n.", "meaning": "敘事者", "sentence e": "The unreliable narrator makes the reader question the truth.", "sentence c": "不可靠的敘事者讓讀者質疑故事的真實性。"}, {"word": "non-linear", "pos": "adj.", "meaning": "非線性的", "sentence e": "The film uses a non-linear structure to reveal the mystery gradually.", "sentence c": "這部電影使用非線性結構逐步揭示謎團。"}, {"word": "pacing", "pos": "n.", "meaning": "節奏", "sentence e": "The fast pacing of the thriller kept the audience on the edge of their seats.", "sentence c": "這部驚悚片快速的節奏讓觀眾緊張得坐立難安。"}, {"word": "perspective", "pos": "n.", "meaning": "觀點；視角", "sentence e": "The story is told from a child's perspective.", "sentence c": "這個故事是從孩子的視角敘述的。"}, {"word": "prolepsis", "pos": "n.", "meaning": "預敘；前敘", "sentence e": "The prolepsis at the beginning foreshadows the tragic ending.", "sentence c": "開頭的預敘暗示了悲劇的結局。"}, {"word": "prologue", "pos": "n.", "meaning": "序言", "sentence e": "The prologue introduces the setting and the main conflict.", "sentence c": "序言介紹了故事背景與主要衝突。"}, {"word": "resolution", "pos": "n.", "meaning": "結局；(問題)解決", "sentence e": "In the resolution, the family finally reunites and the conflict is settled.", "sentence c": "在結局中，一家人終於團聚，衝突得到了解決。"}, {"word": "scene", "pos": "n.", "meaning": "場景；場景敘事", "sentence e": "In the scene, the conversation unfolds in real-time without summary.", "sentence c": "在場景中，對話即時展開，沒有概括。"}, {"word": "stream of consciousness", "pos": "n.", "meaning": "意識流", "sentence e": "James Joyce uses stream of consciousness to mimic inner thoughts.", "sentence c": "詹姆斯·喬伊斯使用意識流來模仿內心思緒。"}, {"word": "subplot", "pos": "n.", "meaning": "次要情節；支線", "sentence e": "The subplot involving the detective's personal life adds depth to the main story.", "sentence c": "涉及偵探個人生活的次要情節為主線增添了深度。"}, {"word": "summary", "pos": "n.", "meaning": "概括；概要敘事", "sentence e": "The author uses a summary to quickly cover the protagonist's uneventful years.", "sentence c": "作者使用概括來快速交代主角平淡的幾年。"}, {"word": "third-person limited", "pos": "n.", "meaning": "第三人稱有限視角", "sentence e": "Third-person limited narration reveals only one character's thoughts.", "sentence c": "第三人稱有限視角僅揭示單一角色的想法。"}, {"word": "third-person omniscient", "pos": "n.", "meaning": "第三人稱全知視角", "sentence e": "Third-person omniscient narration knows everything about all characters.", "sentence c": "第三人稱全知視角了解所有角色的一切。"}, {"word": "transition", "pos": "n.", "meaning": "過渡", "sentence e": "Use transition words like \"however\" and \"moreover\" to improve the flow of your essay.", "sentence c": "使用像「然而」和「此外」之類的過渡詞來改善文章的連貫性。"}, {"word": "unreliable narrator", "pos": "n.", "meaning": "不可靠的敘事者", "sentence e": "The reader cannot fully trust the story told by an unreliable narrator.", "sentence c": "讀者無法完全信任不可靠敘事者所講述的故事。"}, {"word": "zero focalization", "pos": "n.", "meaning": "零聚焦；全知聚焦", "sentence e": "Zero focalization allows the narrator to know everything about all characters.", "sentence c": "零聚焦允許敘事者了解所有角色的一切。"}], "poetic-devices": [{"word": "alliteration", "pos": "n.", "meaning": "頭韻", "sentence e": "\"She sells seashells\" uses alliteration with the \"s\" sound.", "sentence c": "「she sells seashells」使用了 s 音的頭韻。"}, {"word": "assonance", "pos": "n.", "meaning": "母韻；元音韻", "sentence e": "The repetition of the long \"o\" sound in \"slow motion\" is assonance.", "sentence c": "「slow motion」中長 o 音的重複就是母韻。"}, {"word": "caesura", "pos": "n.", "meaning": "詩行中間的停頓", "sentence e": "A strong caesura appears after the word \"death\" in the middle of the line.", "sentence c": "在詩行中間，「death」一詞之後出現一個強烈的停頓。"}, {"word": "consonance", "pos": "n.", "meaning": "子音韻", "sentence e": "\"Pitter-patter\" shows consonance with the \"t\" and \"r\" sounds.", "sentence c": "「pitter-patter」展現了 t 與 r 音的子音韻。"}, {"word": "elegy", "pos": "n.", "meaning": "輓歌", "sentence e": "In Memoriam by Tennyson is a long elegy for a lost friend.", "sentence c": "丁尼生的《紀念》是為逝去友人寫的長篇輓歌。"}, {"word": "enjambment", "pos": "n.", "meaning": "跨行；跨句", "sentence e": "The sentence continues to the next line without pause, creating enjambment.", "sentence c": "句子未停頓直接延續到下一行，形成跨行。"}, {"word": "foot", "pos": "n.", "meaning": "音步", "sentence e": "Iambic pentameter consists of five feet per line.", "sentence c": "抑揚格五音步每行包含五個音步。"}, {"word": "free verse", "pos": "n.", "meaning": "自由詩", "sentence e": "Modern poets often use free verse with no regular meter or rhyme.", "sentence c": "現代詩人經常使用無固定格律或押韻的自由詩。"}, {"word": "iamb", "pos": "n.", "meaning": "抑揚格", "sentence e": "An iamb is an unstressed syllable followed by a stressed syllable.", "sentence c": "抑揚格是一個非重讀音節後接一個重讀音節。"}, {"word": "meter", "pos": "n.", "meaning": "格律；音步", "sentence e": "The poem is written in iambic pentameter.", "sentence c": "這首詩是以抑揚格五音步寫成的。"}, {"word": "ode", "pos": "n.", "meaning": "頌詩", "sentence e": "Keats wrote \"Ode on a Grecian Urn\" as a celebration of art and beauty.", "sentence c": "濟慈寫下《希臘古甕頌》來歌頌藝術與美。"}, {"word": "rhyme", "pos": "n.", "meaning": "押韻", "sentence e": "The poet uses rhyme to create a musical effect.", "sentence c": "詩人使用押韻來營造音樂效果。"}, {"word": "rhythm", "pos": "n.", "meaning": "節奏", "sentence e": "The rhythm of the poem mimics the sound of waves.", "sentence c": "詩的節奏模仿了海浪的聲音。"}, {"word": "sonnet", "pos": "n.", "meaning": "十四行詩", "sentence e": "Shakespeare wrote 154 sonnets following a specific rhyme scheme.", "sentence c": "莎士比亞按照特定押韻格式創作了154首十四行詩。"}, {"word": "stanza", "pos": "n.", "meaning": "詩節", "sentence e": "Each stanza in the poem explores a different season.", "sentence c": "詩中的每個詩節探討一個不同的季節。"}, {"word": "trochee", "pos": "n.", "meaning": "揚抑格", "sentence e": "A trochee is a stressed syllable followed by an unstressed syllable.", "sentence c": "揚抑格是一個重讀音節後接一個非重讀音節。"}, {"word": "villanelle", "pos": "n.", "meaning": "維拉內拉詩", "sentence e": "\"Do not go gentle into that good night\" is a famous villanelle.", "sentence c": "《溫柔地不要走進那良夜》是一首著名的維拉內拉詩。"}], "reading-skills": [{"word": "biased", "pos": "adj.", "meaning": "有偏見的", "sentence e": "The news article was criticized for being biased toward the ruling party.", "sentence c": "這篇新聞報導因偏袒執政黨而受到批評。"}, {"word": "comprehension", "pos": "n.", "meaning": "理解；閱讀理解", "sentence e": "Reading comprehension is essential for academic success.", "sentence c": "閱讀理解是學業成功的關鍵。"}, {"word": "condescending", "pos": "adj.", "meaning": "居高臨下的", "sentence e": "The professor's condescending tone made the students feel unintelligent.", "sentence c": "教授那居高臨下的語氣讓學生們覺得自己很不聰明。"}, {"word": "context clue", "pos": "n.", "meaning": "上下文線索", "sentence e": "Readers can use context clues to guess the meaning of unfamiliar words.", "sentence c": "讀者可以利用上下文線索猜測生詞的含義。"}, {"word": "cynical", "pos": "adj.", "meaning": "憤世嫉俗的；懷疑人性自私的", "sentence e": "The author's cynical view suggests that people only help others for personal gain.", "sentence c": "作者憤世嫉俗的觀點暗示人們幫助他人只是為了個人利益。"}, {"word": "indifferent", "pos": "adj.", "meaning": "冷淡的；不在意的", "sentence e": "The protagonist remained indifferent to the suffering of those around him.", "sentence c": "主角對身邊人的痛苦保持冷漠。"}, {"word": "inference", "pos": "n.", "meaning": "推論；推斷", "sentence e": "Making inferences helps readers understand what is not directly stated.", "sentence c": "做出推論能幫助讀者理解未直接陳述的內容。"}, {"word": "main idea", "pos": "n.", "meaning": "主旨；中心思想", "sentence e": "Identifying the main idea is the first step in summarizing a text.", "sentence c": "識別主旨是總結文本的第一步。"}, {"word": "nostalgic", "pos": "adj.", "meaning": "懷舊的", "sentence e": "The poem has a nostalgic tone, reflecting on the simple joys of childhood.", "sentence c": "這首詩帶有懷舊的語調，反思童年簡單的快樂。"}, {"word": "optimistic", "pos": "adj.", "meaning": "樂觀的", "sentence e": "Despite the challenges, the author maintains an optimistic outlook for the future.", "sentence c": "儘管面臨挑戰，作者對未來仍保持樂觀的見解。"}, {"word": "reverent", "pos": "adj.", "meaning": "虔誠的；恭敬的", "sentence e": "The biographer wrote in a reverent tone when describing the leader's sacrifices.", "sentence c": "傳記作者在描述這位領袖的犧牲時，語氣充滿了崇敬。"}, {"word": "sardonic", "pos": "adj.", "meaning": "嘲諷的；譏諷的", "sentence e": "His sardonic laugh suggested that he didn't believe a word of the explanation.", "sentence c": "他那譏諷的笑聲暗示他對那番解釋一個字也不信。"}, {"word": "skeptical", "pos": "adj.", "meaning": "懷疑的", "sentence e": "Many scientists remain skeptical about the new claims until they see data.", "sentence c": "許多科學家在看到數據之前，對這些新主張仍持懷疑態度。"}, {"word": "supporting detail", "pos": "n.", "meaning": "支持細節；佐證細節", "sentence e": "Supporting details provide evidence for the main idea.", "sentence c": "支持細節為主旨提供證據。"}], "structure": [{"word": "argumentative paragraph", "pos": "n.", "meaning": "論證段；議論文段", "sentence e": "An argumentative paragraph presents a claim supported by evidence and reasoning.", "sentence c": "論證段提出一個由證據與推理支持的主張。"}, {"word": "block paragraph", "pos": "n.", "meaning": "齊頭式段落", "sentence e": "Block paragraphs have no indentation but are separated by a blank line.", "sentence c": "齊頭式段落無縮排，但以空行分隔。"}, {"word": "body paragraph", "pos": "n.", "meaning": "主體段；論證段", "sentence e": "Each body paragraph develops one main point that supports the thesis.", "sentence c": "每個主體段發展一個支持論點的主要觀點。"}, {"word": "cause and effect", "pos": "n.", "meaning": "因果關係", "sentence e": "A cause-and-effect paragraph explains why something happens and what results from it.", "sentence c": "因果段落解釋某事發生的原因及其結果。"}, {"word": "cause-and-effect", "pos": "n.", "meaning": "因果關係", "sentence e": "A cause-and-effect structure explains why an event occurred and what resulted from it.", "sentence c": "因果結構解釋事件發生的原因及其結果。"}, {"word": "chronological order", "pos": "n.", "meaning": "時間順序", "sentence e": "Chronological order arranges events in the sequence they occurred.", "sentence c": "時間順序按事件發生的先後排列。"}, {"word": "clarity", "pos": "n.", "meaning": "清晰", "sentence e": "Good writing is marked by clarity and precision.", "sentence c": "好的寫作以清晰與精確為特點。"}, {"word": "classification", "pos": "n.", "meaning": "分類", "sentence e": "Classification organizes ideas into categories for clearer understanding.", "sentence c": "分類將觀點歸入不同類別以利清晰理解。"}, {"word": "clincher", "pos": "n.", "meaning": "有力結尾；點睛句", "sentence e": "A clincher is a memorable final sentence that reinforces the main point.", "sentence c": "有力結尾是令人難忘的最後一句，用以強化主旨。"}, {"word": "coherence", "pos": "n.", "meaning": "連貫性", "sentence e": "The essay lacks coherence between paragraphs.", "sentence c": "這篇文章在段落之間缺乏連貫性。"}, {"word": "compare-and-contrast", "pos": "n.", "meaning": "比較與對比", "sentence e": "The essay uses a compare-and-contrast pattern to analyze two literary movements.", "sentence c": "文章使用比較與對比模式分析兩個文學運動。"}, {"word": "comparison", "pos": "n.", "meaning": "比較", "sentence e": "Comparison highlights similarities between two or more items.", "sentence c": "比較強調兩個或多個項目之間的相似之處。"}, {"word": "concluding paragraph", "pos": "n.", "meaning": "結論段；總結段", "sentence e": "The concluding paragraph restates the thesis and synthesizes key arguments.", "sentence c": "結論段重述論點並綜合關鍵論證。"}, {"word": "concluding sentence", "pos": "n.", "meaning": "結尾句", "sentence e": "A concluding sentence summarizes the main point of the paragraph.", "sentence c": "結尾句總結段落的主要觀點。"}, {"word": "contrast", "pos": "n.", "meaning": "對比", "sentence e": "Contrast emphasizes differences to clarify distinctions.", "sentence c": "對比強調差異以釐清區別。"}, {"word": "controlling idea", "pos": "n.", "meaning": "控制概念；限定主旨", "sentence e": "The controlling idea in the topic sentence limits the scope of the paragraph.", "sentence c": "主題句中的控制概念限定了段落的討論範圍。"}, {"word": "definition", "pos": "n.", "meaning": "定義", "sentence e": "A definition paragraph explains the meaning of a term or concept.", "sentence c": "定義段落解釋某個術語或概念的含義。"}, {"word": "descriptive paragraph", "pos": "n.", "meaning": "描述段", "sentence e": "A descriptive paragraph uses sensory details to create a vivid picture.", "sentence c": "描述段運用感官細節營造生動畫面。"}, {"word": "exemplification", "pos": "n.", "meaning": "舉例說明", "sentence e": "Exemplification uses specific cases to illustrate a general point.", "sentence c": "舉例說明使用具體案例來闡釋一般觀點。"}, {"word": "expository paragraph", "pos": "n.", "meaning": "說明段", "sentence e": "An expository paragraph explains or informs about a topic objectively.", "sentence c": "說明段客觀地解釋或介紹某個主題。"}, {"word": "indentation", "pos": "n.", "meaning": "縮排", "sentence e": "Indentation signals the beginning of a new paragraph in formal writing.", "sentence c": "縮排在正式寫作中標示新段落的開始。"}, {"word": "introductory paragraph", "pos": "n.", "meaning": "引言段；開頭段", "sentence e": "The introductory paragraph presents the topic and thesis statement.", "sentence c": "引言段提出主題與論點陳述。"}, {"word": "lexical cohesion", "pos": "n.", "meaning": "詞彙銜接", "sentence e": "Lexical cohesion uses synonyms and related words to link ideas.", "sentence c": "詞彙銜接使用同義詞與相關詞彙來連接觀點。"}, {"word": "logical", "pos": "adj.", "meaning": "合邏輯的", "sentence e": "The argument is logical and well-structured.", "sentence c": "這個論點合邏輯且結構良好。"}, {"word": "narrative paragraph", "pos": "n.", "meaning": "敘事段", "sentence e": "A narrative paragraph tells a short story or recounts an event in sequence.", "sentence c": "敘事段講述一個小故事或按順序敘述事件。"}, {"word": "order of importance", "pos": "n.", "meaning": "重要性順序", "sentence e": "Order of importance arranges points from most to least significant (or vice versa).", "sentence c": "重要性順序按從最重要到最不重要（或相反）排列觀點。"}, {"word": "paragraph development", "pos": "n.", "meaning": "段落展開；段落發展", "sentence e": "Common methods of paragraph development include exemplification and comparison.", "sentence c": "常見的段落展開方法包括舉例與比較。"}, {"word": "paragraph hook", "pos": "n.", "meaning": "段落引子；開頭鉤 ' help connect ideas between sentences.", "sentence c": "像 'furthermore' 和 'however' 這類過渡詞有助於連接句與句之間的觀點。"}, {"word": "transitional phrase", "pos": "n.", "meaning": "過渡片語", "sentence e": "Transitional phrases such as 'on the other hand' signal a shift in perspective.", "sentence c": "像 'on the other hand' 這類過渡片語標示觀點的轉換。"}, {"word": "unity", "pos": "n.", "meaning": "統一性；一致性", "sentence e": "Paragraph unity means every sentence relates directly to the main idea.", "sentence c": "段落統一性意味著每句話都直接關聯主旨。"}], "writing": [{"word": "brainstorm", "pos": "v.", "meaning": "腦力激盪；構思", "sentence e": "Before writing, brainstorm ideas to organize your thoughts.", "sentence c": "寫作前先進行腦力激盪，整理思路。"}, {"word": "colloquial", "pos": "adj.", "meaning": "口語的；非正式的", "sentence e": "The writer uses colloquial language to make the characters sound more authentic.", "sentence c": "作者使用口語化的語言，使角色聽起來更加真實。"}, {"word": "concise", "pos": "adj.", "meaning": "簡潔的", "sentence e": "The editor asked the writer to make the paragraph more concise by removing extra words.", "sentence c": "編輯要求作者刪除多餘的字詞，使段落更加簡潔。"}, {"word": "draft", "pos": "n.", "meaning": "草稿；初稿", "sentence e": "The first draft doesn't need to be perfect; you can revise later.", "sentence c": "初稿不需要完美，你可以稍後修改。"}, {"word": "eloquent", "pos": "adj.", "meaning": "雄辯的；口才流利的", "sentence e": "The activist gave an eloquent speech that moved many in the audience.", "sentence c": "這位活動家發表了一場動人的雄辯演說，感動了許多觀眾。"}, {"word": "figurative", "pos": "adj.", "meaning": "比喻的", "sentence e": "\"Broken heart\" is a figurative expression.", "sentence c": "「心碎」是一種比喻性表達。"}, {"word": "literal", "pos": "adj.", "meaning": "字面的", "sentence e": "Don't take his words literally; he was being sarcastic.", "sentence c": "不要字面理解他的話；他在諷刺。"}, {"word": "objective", "pos": "adj.", "meaning": "客觀的", "sentence e": "News reporters are expected to give an objective account of events without personal bias.", "sentence c": "新聞記者被要求對事件進行客觀報導，而不帶個人偏見。"}, {"word": "ornate", "pos": "adj.", "meaning": "華麗的", "sentence e": "The Victorian novel was known for its ornate and flowery language.", "sentence c": "這部維多利亞時代的小說以其華麗且詞藻豐富的語言聞名。"}, {"word": "outline", "pos": "n.", "meaning": "大綱；提綱", "sentence e": "Creating an outline helps structure your essay logically.", "sentence c": "製作大綱有助於邏輯性地組織文章結構。"}, {"word": "peer review", "pos": "n.", "meaning": "同儕評閱", "sentence e": "Peer review allows students to give and receive constructive feedback.", "sentence c": "同儕評閱讓學生能夠給予並接收建設性回饋。"}, {"word": "redundant", "pos": "adj.", "meaning": "贅述的；多餘的", "sentence e": "Mentioning the \"blue sky\" as \"blue\" is sometimes considered redundant in creative writing.", "sentence c": "在創意寫作中，提到「藍色的藍天」有時被認為是贅述。"}, {"word": "revise", "pos": "v.", "meaning": "修訂；修改", "sentence e": "Revise your essay to improve clarity and coherence.", "sentence c": "修訂文章以提升清晰度與連貫性。"}, {"word": "subjective", "pos": "adj.", "meaning": "主觀的", "sentence e": "Your opinion of the movie is purely subjective and depends on your personal taste.", "sentence c": "你對這部電影的評價純粹是主觀的，取決於你個人的品味。"}, {"word": "verbose", "pos": "adj.", "meaning": "冗長的", "sentence e": "His writing style is often verbose, making simple ideas hard to understand.", "sentence c": "他的寫作風格通常很冗長，使簡單的想法變得難以理解。"}]};

// ── STRAND CONFIG ──
const STRAND_CONFIG = {
  'literary':          { icon: '🌿', color: '#5a7a5c' },
  'narrative':         { icon: '📜', color: '#7a5a2a' },
  'academic':          { icon: '🎓', color: '#3d4f8a' },
  'structure':         { icon: '🏛️', color: '#6a4a8a' },
  'drama':             { icon: '🎭', color: '#b85c6e' },
  'critics':           { icon: '🔍', color: '#2d6a7a' },
  'character-analysis':{ icon: '🪞', color: '#8a5a2a' },
  'grammar':           { icon: '✍️', color: '#2a7a5a' },
  'poetic-devices':    { icon: '🌸', color: '#b8629a' },
  'writing':           { icon: '🖋️', color: '#5a7a8a' },
  'reading-skills':    { icon: '👁️', color: '#8a7a2a' },
  'genre':             { icon: '📚', color: '#4a6a8a' },
  'argumentation':     { icon: '⚖️', color: '#7a4a4a' },
};

// ── STATE ──
let currentStrand = null;
let starred = new Set(JSON.parse(localStorage.getItem('la_starred') || '[]'));
let currentTab = 'strands';
let listMode = false;
// Flashcard state
let fcDeck = [];
let fcIndex = 0;
let fcStarredMode = false;

// ── HELPERS ──
function saveStarred() { localStorage.setItem('la_starred', JSON.stringify([...starred])); }
function wordKey(strand, word) { return strand + '::' + word; }
function allWords() {
  const arr = [];
  for (const [strand, words] of Object.entries(DATA)) words.forEach(w => arr.push({...w, strand}));
  return arr;
}

// ── STRAND VIEW ──
function renderStrands() {
  const sv = document.getElementById('strandView');
  sv.innerHTML = '';
  const strands = Object.entries(DATA).sort((a,b) => b[1].length - a[1].length);
  strands.forEach(([name, words], i) => {
    const cfg = STRAND_CONFIG[name] || { icon: '📖', color: '#c9973a' };
    const preview = words[0] ? words[0].word + ' · ' + words[0].meaning : '';
    const card = document.createElement('div');
    card.className = 'strand-card';
    card.style.setProperty('--strand-color', cfg.color);
    card.style.animationDelay = (i * 0.04) + 's';
    card.innerHTML = `
      <span class="strand-icon">${cfg.icon}</span>
      <div class="strand-name">${name.replace(/-/g,' ')}</div>
      <div class="strand-count">${words.length} terms</div>
      <div class="strand-preview">${preview}</div>
    `;
    card.onclick = () => openStrand(name);
    sv.appendChild(card);
  });
}

// ── WORD VIEW ──
function openStrand(name) {
  currentStrand = name;
  const cfg = STRAND_CONFIG[name] || { icon: '📖', color: '#c9973a' };
  document.getElementById('strandView').style.display = 'none';
  document.getElementById('wordView').style.display = 'block';
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('searchResultsView').style.display = 'none';

  const bar = document.getElementById('strandTitleBar');
  bar.innerHTML = `
    <span style="font-size:1.8rem">${cfg.icon}</span>
    <h2 style="font-family:'Playfair Display',serif;">${name.replace(/-/g,' ')}</h2>
    <span class="strand-badge" style="background:${cfg.color}">${DATA[name].length} terms</span>
    <div class="view-toggle" style="margin-left:auto">
      <button class="view-btn active" id="gridBtn" onclick="setListMode(false)" title="Grid">⊞</button>
      <button class="view-btn" id="listBtn" onclick="setListMode(true)" title="List">☰</button>
    </div>
  `;
  renderWords(DATA[name], name);
}

function setListMode(mode) {
  listMode = mode;
  document.getElementById('gridBtn').classList.toggle('active', !mode);
  document.getElementById('listBtn').classList.toggle('active', mode);
  document.getElementById('wordGrid').className = 'word-grid' + (mode ? ' list-mode' : '');
  if (currentStrand) renderWords(DATA[currentStrand], currentStrand);
}

function renderWords(words, strand, highlight='') {
  const grid = document.getElementById('wordGrid');
  grid.className = listMode ? 'list-mode' : '';
  grid.innerHTML = '';
  words.forEach((w, idx) => {
    grid.appendChild(buildWordCard(w, strand, highlight, idx));
  });
}

function buildWordCard(w, strand, highlight='', idx=0) {
  const key = wordKey(strand, w.word);
  const isStarred = starred.has(key);
  const hl = (str) => highlight ? str.replace(new RegExp(`(${highlight})`, 'gi'), '<mark>$1</mark>') : str;

  const card = document.createElement('div');
  card.className = 'word-card' + (isStarred ? ' starred' : '');
  card.style.animationDelay = (idx * 0.03) + 's';
  card.dataset.key = key;

  card.innerHTML = `
    <div class="word-card-head">
      <div>
        <div class="word-english">${hl(w.word)}</div>
        <div class="word-pos">${w.pos}</div>
      </div>
    </div>
    <div class="word-chinese">${hl(w.meaning)}</div>
    <div class="sentences">
      <div class="sentence-label">English</div>
      <div class="sentence">${hl(w['sentence e'] || '')}</div>
      <div class="sentence-label" style="margin-top:0.5rem">中文</div>
      <div class="sentence cn">${hl(w['sentence c'] || '')}</div>
    </div>
    <div class="card-actions">
      <button class="btn-pronounce" onclick="pronounce('${w.word.replace(/'/g,"\\'")}',this)">🔊 Pronounce</button>
      <button class="btn-star" onclick="toggleStar('${key}',this,'${strand}')" title="Star this word">${isStarred ? '⭐' : '☆'}</button>
    </div>
  `;
  return card;
}

// ── PRONUNCIATION ──
function pronounce(word, btn) {
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    btn.textContent = '🔊 …';
    u.onend = () => btn.textContent = '🔊 Pronounce';
    speechSynthesis.speak(u);
  } else {
    alert('Speech synthesis not supported in this browser.');
  }
}

// ── STAR ──
function toggleStar(key, btn, strand) {
  if (starred.has(key)) {
    starred.delete(key);
    btn.textContent = '☆';
    btn.closest('.word-card').classList.remove('starred');
  } else {
    starred.add(key);
    btn.textContent = '⭐';
    btn.closest('.word-card').classList.add('starred');
    showToast('⭐ Word starred!');
  }
  saveStarred();
  document.getElementById('starCount').textContent = starred.size;
  if (currentTab === 'starred') renderStarred();
}

function showToast(msg) {
  const t = document.getElementById('starToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ── NAVIGATION ──
function showTab(tab) {
  currentTab = tab;
  // Update tabs
  ['strands','flashcard','starred'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1))?.classList.toggle('active', t === tab);
  });
  // Hide all views
  document.getElementById('strandView').style.display = 'none';
  document.getElementById('wordView').style.display = 'none';
  document.getElementById('flashcardView').style.display = 'none';
  document.getElementById('starredView').style.display = 'none';
  document.getElementById('searchResultsView').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  clearSearch();

  if (tab === 'strands') {
    document.getElementById('strandView').style.display = 'grid';
  } else if (tab === 'flashcard') {
    document.getElementById('flashcardView').style.display = 'flex';
    initFlashcard();
  } else if (tab === 'starred') {
    document.getElementById('starredView').style.display = 'block';
    renderStarred();
  }
}

function goBack() {
  currentStrand = null;
  document.getElementById('wordView').style.display = 'none';
  document.getElementById('strandView').style.display = 'grid';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('searchResultsView').style.display = 'none';
  clearSearch();
}

// ── SEARCH ──
function handleSearch(val) {
  const v = val.trim();
  document.getElementById('clearBtn').style.display = v ? 'block' : 'none';
  if (!v) {
    document.getElementById('searchCount').textContent = '';
    document.getElementById('searchResultsView').style.display = 'none';
    if (currentTab === 'strands' && !currentStrand) {
      document.getElementById('strandView').style.display = 'grid';
    } else if (currentStrand) {
      document.getElementById('wordView').style.display = 'block';
      renderWords(DATA[currentStrand], currentStrand);
    }
    return;
  }

  const lower = v.toLowerCase();
  const allW = allWords();
  const hits = allW.filter(w =>
    w.word.toLowerCase().includes(lower) ||
    w.meaning.includes(v) ||
    (w['sentence e'] || '').toLowerCase().includes(lower) ||
    (w['sentence c'] || '').includes(v)
  );

  document.getElementById('searchCount').textContent = hits.length + ' result' + (hits.length !== 1 ? 's' : '');

  // Show results in searchResultsView
  document.getElementById('strandView').style.display = 'none';
  document.getElementById('wordView').style.display = 'none';
  document.getElementById('flashcardView').style.display = 'none';
  document.getElementById('starredView').style.display = 'none';

  const rv = document.getElementById('searchResultsView');
  rv.style.display = 'block';
  rv.innerHTML = '';

  if (hits.length === 0) {
    rv.innerHTML = '<p style="text-align:center;padding:3rem;font-style:italic;color:var(--mist)">No results found for "' + v + '"</p>';
    return;
  }

  // Group by strand
  const grouped = {};
  hits.forEach(w => {
    if (!grouped[w.strand]) grouped[w.strand] = [];
    grouped[w.strand].push(w);
  });

  const grid = document.createElement('div');
  grid.id = 'wordGrid';
  grid.className = listMode ? 'list-mode' : '';
  let idx = 0;

  for (const [strand, words] of Object.entries(grouped)) {
    const label = document.createElement('div');
    label.className = 'search-result-strand';
    const cfg = STRAND_CONFIG[strand] || { icon: '📖' };
    label.textContent = cfg.icon + ' ' + strand.replace(/-/g,' ').toUpperCase();
    rv.appendChild(label);

    const sg = document.createElement('div');
    sg.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-bottom:1rem';
    words.forEach(w => sg.appendChild(buildWordCard(w, strand, v, idx++)));
    rv.appendChild(sg);
  }
}

function clearSearch() {
  const inp = document.getElementById('globalSearch');
  inp.value = '';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('searchCount').textContent = '';
  document.getElementById('searchResultsView').style.display = 'none';
  if (currentTab === 'strands' && !currentStrand) {
    document.getElementById('strandView').style.display = 'grid';
  } else if (currentStrand) {
    document.getElementById('wordView').style.display = 'block';
    renderWords(DATA[currentStrand], currentStrand);
  }
}

// ── FLASHCARD ──
function initFlashcard(useStarred=false) {
  fcStarredMode = useStarred;
  let words = allWords();
  if (useStarred) words = words.filter(w => starred.has(wordKey(w.strand, w.word)));
  fcDeck = words;
  fcIndex = 0;
  document.getElementById('fcDeckInfo').textContent = fcDeck.length + ' cards in deck';
  document.getElementById('fcStarBtn').textContent = useStarred ? '⭐ All Words' : '⭐ Starred Only';
  renderFcCard();
}

function renderFcCard() {
  const inner = document.getElementById('fcInner');
  inner.classList.remove('flipped');
  if (fcDeck.length === 0) {
    document.getElementById('fcWord').textContent = '(no cards)';
    document.getElementById('fcMeaning').textContent = '—';
    document.getElementById('fcSentE').textContent = '';
    document.getElementById('fcSentC').textContent = '';
    document.getElementById('fcProgress').textContent = '0 / 0';
    return;
  }
  const w = fcDeck[fcIndex];
  document.getElementById('fcWord').textContent = w.word;
  document.getElementById('fcMeaning').textContent = w.meaning;
  document.getElementById('fcSentE').textContent = w['sentence e'] || '';
  document.getElementById('fcSentC').textContent = w['sentence c'] || '';
  document.getElementById('fcProgress').textContent = (fcIndex + 1) + ' / ' + fcDeck.length;
  document.getElementById('fcDeckInfo').textContent = fcDeck.length + ' cards · ' + w.strand.replace(/-/g,' ');
}

function flipCard() {
  document.getElementById('fcInner').classList.toggle('flipped');
  if ('speechSynthesis' in window) {
    const w = fcDeck[fcIndex];
    if (w && !document.getElementById('fcInner').classList.contains('flipped')) return;
    if (w) {
      const u = new SpeechSynthesisUtterance(w.word);
      u.lang = 'en-US'; u.rate = 0.85;
      speechSynthesis.speak(u);
    }
  }
}

function fcNext() { if (fcDeck.length) { fcIndex = (fcIndex+1) % fcDeck.length; renderFcCard(); } }
function fcPrev() { if (fcDeck.length) { fcIndex = (fcIndex - 1 + fcDeck.length) % fcDeck.length; renderFcCard(); } }
function fcShuffle() {
  for (let i = fcDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [fcDeck[i], fcDeck[j]] = [fcDeck[j], fcDeck[i]];
  }
  fcIndex = 0; renderFcCard();
}
function fcStarredOnly() { initFlashcard(!fcStarredMode); }
function fcReset() { fcIndex = 0; renderFcCard(); }

// ── STARRED VIEW ──
function renderStarred() {
  const sg = document.getElementById('starredGrid');
  sg.innerHTML = '';
  const words = allWords().filter(w => starred.has(wordKey(w.strand, w.word)));
  if (words.length === 0) {
    sg.innerHTML = '<p class="starred-empty">✦ No starred words yet.<br>Star words while studying to collect them here.</p>';
    return;
  }
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem';
  words.forEach((w,i) => grid.appendChild(buildWordCard(w, w.strand, '', i)));
  sg.appendChild(grid);
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', e => {
  if (document.activeElement === document.getElementById('globalSearch')) return;
  if (e.key === 'ArrowRight' && currentTab === 'flashcard') fcNext();
  if (e.key === 'ArrowLeft' && currentTab === 'flashcard') fcPrev();
  if (e.key === ' ' && currentTab === 'flashcard') { e.preventDefault(); flipCard(); }
});

// ── INIT ──
document.getElementById('starCount').textContent = starred.size;
renderStrands();
initFlashcard();
</script>
</body>
</html>
